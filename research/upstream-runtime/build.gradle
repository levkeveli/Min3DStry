import java.security.MessageDigest

plugins {
    id 'java'
    id 'org.teavm' version '0.16.0'
}

repositories { mavenCentral() }

def revision = '19a0f40d44514f4802a8b79770456e7e32e34da0'
def upstreamFile = 'core/src/mindustry/logic/LogicOp.java'
def blockSource = 'core/src/mindustry/world/Block.java'
def annotationsSource = 'annotations/src/main/java/mindustry/annotations/Annotations.java'
def arcRevision = '7445105cd2683daf5b9ac7033ebb07265d3e814d'
def fileSource = 'arc-core/src/arc/files/Fi.java'
def osSource = 'arc-core/src/arc/util/OS.java'
def pixmapSource = 'arc-core/src/arc/graphics/Pixmap.java'
def pixmapPatch = file('patches/arc-pixmap-direct-buffer.patch')
def glacier = 'core/assets/maps/default/glacier.msav'
def upstream = providers.gradleProperty('upstreamCheckout')
def arc = providers.gradleProperty('arcCheckout')
def probe = providers.gradleProperty('probe').getOrElse('logic')
def entryPoints = [
    logic: 'mindustry.logic.UpstreamLogicProbe',
    map: 'mindustry.maps.UpstreamMapProbe',
    'map-sd': 'mindustry.maps.UpstreamSdMapProbe',
    content: 'UpstreamContentBaseline',
    resource: 'port.UpstreamResourceProbe',
    executor: 'port.concurrent.UpstreamExecutorProbe',
    'content-init': 'UpstreamContentInitializationProbe',
    world: 'UpstreamWorldLoadProbe',
    'world-save': 'UpstreamWorldSaveProbe',
    'world-roundtrip': 'UpstreamWorldRoundTripProbe',
    'terrain-draw': 'UpstreamTerrainDrawProbe',
    'file-metadata': 'port.UpstreamFileMetadataProbe'
]
if (!entryPoints.containsKey(probe)) {
    throw new GradleException("Expected -Pprobe to be one of ${entryPoints.keySet()}")
}
def entryPoint = entryPoints[probe]
def usesMapSources = probe in ['map', 'map-sd']
def usesWorldSources = probe in ['world', 'world-save', 'world-roundtrip', 'terrain-draw']
def initializesContent = probe == 'content-init' || usesWorldSources
def usesContentSources = probe == 'content' || initializesContent
def usesExecutor = usesContentSources || probe == 'executor'
def usesArcSources = usesContentSources || probe == 'resource'
def pluginsToLoad = []
if (usesArcSources) pluginsToLoad.add('port.ResourceVirtualMethods')
if (usesExecutor) pluginsToLoad.add('port.concurrent.ArcPoolSupport')
if (usesWorldSources) {
    pluginsToLoad.addAll(['port.AnonymousClassSupport', 'port.WorldProbeSupport'])
}
def referenceJar = file(providers.gradleProperty('referenceJar').getOrElse('server-release.jar'))
def sourceDir = layout.buildDirectory.dir("upstream-src/${probe}")
def sourceFile = sourceDir.map { it.file('mindustry/logic/LogicOp.java') }
def mapFile = sourceDir.map { it.file('mindustry/maps/GlacierFixture.java') }
def blockFile = sourceDir.map { it.file('mindustry/world/Block.java') }
def annotationsFile = sourceDir.map { it.file('mindustry/annotations/Annotations.java') }
def arcFile = sourceDir.map { it.file('arc/files/Fi.java') }
def arcOsFile = sourceDir.map { it.file('arc/util/OS.java') }
def arcPixmapFile = sourceDir.map { it.file('arc/graphics/Pixmap.java') }
def compilerResources = layout.buildDirectory.dir("compiler-resources/${probe}")
def pluginFile = compilerResources.map { it.file('META-INF/services/org.teavm.vm.spi.TeaVMPlugin') }
def readUpstream = { path ->
    providers.exec {
        commandLine 'git', '-C', upstream.get(), 'show', "${revision}:${path}"
    }.standardOutput.asBytes.get()
}

if (usesArcSources || usesExecutor) {
    def stagedClasses = []
    if (usesContentSources) {
        stagedClasses.add('mindustry/world/Block.class')
    }
    if (usesArcSources) {
        stagedClasses.addAll(['arc/files/Fi.class', 'arc/files/Fi$*.class'])
    }
    if (usesExecutor) {
        stagedClasses.add('arc/util/OS.class')
    }
    if (initializesContent) {
        stagedClasses.addAll(['arc/graphics/Pixmap.class', 'arc/graphics/Pixmap$*.class'])
    }
    // TeaVM resolves dependency classes before compiled project classes.
    def contentDependencies = tasks.register('prepareContentDependencies', Zip) {
        dependsOn 'prepareUpstreamProbe'
        inputs.property('stagedClasses', stagedClasses)
        from(zipTree(referenceJar)) {
            exclude stagedClasses
        }
        destinationDirectory = layout.buildDirectory.dir("probe-dependencies/${probe}")
        archiveFileName = 'server-probe-dependencies.jar'
    }
    dependencies { implementation files(contentDependencies.flatMap { it.archiveFile }).builtBy(contentDependencies) }
} else {
    dependencies { implementation files(referenceJar) }
}
if (usesArcSources) {
    sourceSets.main.java.srcDir('src/resource/java')
}
if (!pluginsToLoad.isEmpty()) {
    dependencies { compileOnly 'org.teavm:teavm-core:0.16.0' }
    sourceSets.main.resources.srcDir(compilerResources)
    tasks.named('processResources') { dependsOn 'prepareUpstreamProbe' }
}
if (usesExecutor) {
    sourceSets.main.java.srcDir('src/concurrent/java')
}
if (usesContentSources) {
    sourceSets.main.java.srcDirs('host', 'src/content/java')
}
if (usesWorldSources) {
    sourceSets.main.java.srcDir('src/world/java')
}
if (probe == 'file-metadata') {
    sourceSets.main.java.srcDir('src/file/java')
}
dependencies {
    if (usesMapSources) {
        implementation 'org.teavm:teavm-interop:0.16.0'
    }
}
sourceSets.main.java.srcDir(sourceDir)
if (usesMapSources) {
    sourceSets.main.java.srcDir('src/map/java')
}
tasks.withType(JavaCompile).configureEach { options.release = 17 }

tasks.register('prepareUpstreamProbe') {
    inputs.property('revision', revision)
    inputs.property('upstreamCheckout', upstream)
    inputs.property('probe', probe)
    inputs.file(referenceJar)
    if (!pluginsToLoad.isEmpty()) {
        inputs.property('compilerPlugins', pluginsToLoad)
        outputs.file(pluginFile)
    }
    outputs.file(sourceFile)
    if (usesMapSources) {
        outputs.file(mapFile)
    }
    if (usesContentSources) {
        outputs.files(blockFile, annotationsFile)
    }
    if (usesArcSources || usesExecutor) {
        inputs.property('arcRevision', arcRevision)
        inputs.property('arcCheckout', arc)
    }
    if (usesArcSources) {
        outputs.file(arcFile)
    }
    if (usesExecutor) {
        outputs.file(arcOsFile)
    }
    if (initializesContent) {
        inputs.file(pixmapPatch)
        outputs.file(arcPixmapFile)
    }
    doLast {
        if (!pluginsToLoad.isEmpty()) {
            def service = pluginFile.get().asFile
            service.parentFile.mkdirs()
            service.setText(pluginsToLoad.join('\n') + '\n', 'UTF-8')
        }
        def sha256 = MessageDigest.getInstance('SHA-256').digest(referenceJar.bytes).encodeHex().toString()
        if (sha256 != 'faeaf247a8b622de940181a96cb21cb20692d3c3da4e8ac3f79cb4af5059aa6c') {
            throw new GradleException('Expected the official v160.8 server-release.jar')
        }
        def output = sourceFile.get().asFile
        output.parentFile.mkdirs()
        output.bytes = readUpstream(upstreamFile)
        if (usesMapSources) {
            def bytes = readUpstream(glacier)
            def encoded = Base64.encoder.encodeToString(bytes)
            // The fixed fixture fits in a Java class-file string constant.
            if (encoded.length() > 65535) {
                throw new GradleException('Glacier fixture exceeds the class-file string limit')
            }
            def fixture = mapFile.get().asFile
            fixture.parentFile.mkdirs()
            fixture.setText("""package mindustry.maps;
final class GlacierFixture {
    static final String BASE64 = "${encoded}";
}
""", 'UTF-8')
        }
        if (usesContentSources) {
            def block = new String(readUpstream(blockSource), 'UTF-8')
            def anonymousCheck = 'current.isAnonymousClass()'
            if (block.count(anonymousCheck) != 1) {
                throw new GradleException('Pinned Block.initBuilding anonymous class check changed')
            }
            def adaptedBlock = blockFile.get().asFile
            adaptedBlock.parentFile.mkdirs()
            adaptedBlock.setText(block.replace(anonymousCheck, 'current.getSimpleName().isEmpty()'), 'UTF-8')
            def annotations = annotationsFile.get().asFile
            annotations.parentFile.mkdirs()
            annotations.bytes = readUpstream(annotationsSource)
        }
        if (usesArcSources) {
            def bytes = providers.exec {
                commandLine 'git', '-C', arc.get(), 'show', "${arcRevision}:${fileSource}"
            }.standardOutput.asBytes.get()
            def source = new String(bytes, 'UTF-8')
            def lookup = '''return Fi.class.getResource("/" + file.getPath().replace('\\\\', '/')) != null;'''
            def streamLookup = '''try (InputStream input = Fi.class.getResourceAsStream("/" + file.getPath().replace('\\\\', '/'))) {
                    return input != null;
                } catch (IOException error) {
                    return false;
                }'''
            if (source.count(lookup) != 1) {
                throw new GradleException('Pinned Arc Fi.exists resource lookup changed')
            }
            def adapted = arcFile.get().asFile
            adapted.parentFile.mkdirs()
            adapted.setText(source.replace(lookup, streamLookup), 'UTF-8')
        }
        if (usesExecutor) {
            def bytes = providers.exec {
                commandLine 'git', '-C', arc.get(), 'show', "${arcRevision}:${osSource}"
            }.standardOutput.asBytes.get()
            def source = new String(bytes, 'UTF-8')
            def processorCount = 'Runtime.getRuntime().availableProcessors()'
            if (source.count(processorCount) != 1) {
                throw new GradleException('Pinned Arc OS processor count changed')
            }
            def adapted = arcOsFile.get().asFile
            adapted.parentFile.mkdirs()
            // TeaVM C runs its managed threads on one execution lane.
            adapted.setText(source.replace(processorCount, '1'), 'UTF-8')
        }
        if (initializesContent) {
            def bytes = providers.exec {
                commandLine 'git', '-C', arc.get(), 'show', "${arcRevision}:${pixmapSource}"
            }.standardOutput.asBytes.get()
            def staged = arcPixmapFile.get().asFile
            staged.parentFile.mkdirs()
            staged.bytes = bytes
            providers.exec {
                commandLine 'git', '-C', sourceDir.get().asFile, 'apply', '--no-index', pixmapPatch
            }.result.get()
        }
    }
}

tasks.named('compileJava') { dependsOn 'prepareUpstreamProbe' }

tasks.register('runProbeJvm', JavaExec) {
    dependsOn 'classes'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = probe == 'map-sd' ? entryPoints.map : entryPoint
}

if (usesContentSources) {
    tasks.register('runBuildingProbeJvm', JavaExec) {
        dependsOn 'classes'
        classpath = sourceSets.main.runtimeClasspath
        mainClass = 'UpstreamBuildingBaseline'
        workingDir = layout.buildDirectory.dir('content-reference').get().asFile
        doFirst { workingDir.mkdirs() }
    }
}

teavm {
    all { mainClass = entryPoint }
    if (usesExecutor) {
        c { obfuscated = false }
    }
}

if (usesWorldSources) {
    apply from: 'gradle/world-compiler.gradle'
    tasks.register('makeWorldSaveFixture', JavaExec) {
        classpath = sourceSets.main.runtimeClasspath
        mainClass = 'UpstreamCurrentSaveFixture'
    }
}
