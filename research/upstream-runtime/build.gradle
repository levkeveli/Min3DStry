    private static String liquidStatText(Liquid liquid, float amount, boolean perSecond){
        return liquid.localizedName + (amount == 0 ? "" : " " + fixValue(amount) + (perSecond ? StatUnit.perSecond.localized() : ""));
    }

    private static String liquidStatText(float period, boolean perSecond, LiquidStack[] stacks){
        StringBuilder label = new StringBuilder();
        for(var stack : stacks){
            if(label.length() != 0) label.append(" / ");
            label.append(liquidStatText(stack.liquid, stack.amount * (60f / period), perSecond));
        }
        return label.toString();
    }

    private static String filteredLiquidStatText(Boolf<Liquid> filter, float amount, boolean perSecond){
        StringBuilder label = new StringBuilder();
        for(var liquid : content.liquids()){
            if(!filter.get(liquid) || !liquid.unlockedNow() || liquid.isHidden()) continue;
            if(label.length() != 0) label.append(" / ");
            label.append(liquidStatText(liquid, amount, perSecond));
        }
        return label.toString();
    }

    private static String filteredItemStatText(Boolf<Item> filter, float period){
        StringBuilder label = new StringBuilder();
        for(var item : content.items()){
            if(!filter.get(item) || !item.unlockedNow() || item.isHidden()) continue;
            if(label.length() != 0) label.append(" / ");
            label.append(item.localizedName);
            if(period > 0) label.append(" 1 (").append(fixValue(60f / period)).append(StatUnit.perSecond.localized()).append(")");
        }
        return label.toString();
    }

    private static <T extends UnlockableContent> String contentListStatText(Seq<T> list, Boolf<T> check, String noneText){
        StringBuilder label = new StringBuilder();
        for(var entry : list){
            if(!check.get(entry)) continue;
            if(label.length() != 0) label.append(" / ");
            label.append(entry.localizedName);
        }
        if(label.length() != 0) return label.toString();
        return noneText.startsWith("@") ? Core.bundle.get(noneText.substring(1)) : noneText;
    }

    private static String drillableStatText(float drillTime, float drillMultiplier, float size, ObjectFloatMap<Item> multipliers, Boolf<Block> filter){
        StringBuilder label = new StringBuilder();
        for(var block : content.blocks()){
            if(!filter.get(block)) continue;
            if(label.length() != 0) label.append('\\n');
            label.append(block.localizedName).append(" / ").append(block.itemDrop.localizedName);
            if(multipliers != null) label.append(" ").append(drillableRate(block, drillTime, drillMultiplier, size, multipliers));
        }
        return label.toString();
    }

    private static String drillableRate(Block block, float drillTime, float drillMultiplier, float size, ObjectFloatMap<Item> multipliers){
        return Strings.autoFixed(60f / (Math.max(drillTime + drillMultiplier * block.itemDrop.hardness, drillTime) / multipliers.get(block.itemDrop, 1f)) * size, 2) + StatUnit.perSecond.localized();
    }

    private static String abilityStatText(Seq<Ability> abilities){
        StringBuilder label = new StringBuilder();
        for(var ability : abilities){
            if(!ability.display) continue;
            if(label.length() != 0) label.append('\\n');
            label.append(ability.localized());
            ability.appendHandheldStats(label);
        }
        return label.toString();
    }

    private static String itemEfficiencyText(Floatf<Item> efficiency, float period, Boolf<Item> filter, ObjectFloatMap<Item> durations){
        StringBuilder label = new StringBuilder();
        for(var item : content.items()){
            if(!filter.get(item) || !item.unlockedNow() || item.isHidden()) continue;
            label.append('\\n').append(item.localizedName);
            if(period > 0){
                float multiplier = durations == null ? 1f : durations.get(item, 1f);
                float rate = 1f / (period * multiplier / 60f);
                label.append(" ").append(Strings.autoFixed(rate, rate < 0.01f ? 4 : 2)).append(StatUnit.perSecond.localized());
            }
            label.append(" ").append(Core.bundle.format("stat.efficiency", fixValue(efficiency.get(item) * 100f)));
        }
        return label.toString();
    }

    private static String liquidEfficiencyText(Floatf<Liquid> efficiency, float amount, Boolf<Liquid> filter){
        StringBuilder label = new StringBuilder();
        for(var liquid : content.liquids()){
            if(!filter.get(liquid) || !liquid.unlockedNow() || liquid.isHidden()) continue;
            label.append('\\n').append(liquidStatText(liquid, amount, true));
            label.append(" ").append(Core.bundle.format("stat.efficiency", fixValue(efficiency.get(liquid) * 100f)));
        }
        return label.toString();
    }

    private static String reloadBoosterText(float reload, float maxUsed, float multiplier, boolean baseReload, Boolf<Liquid> filter){
        StringBuilder label = new StringBuilder();
        for(var liquid : content.liquids()){
            if(!filter.get(liquid)) continue;
            float rate = (baseReload ? 1f : 0f) + maxUsed * multiplier * liquid.heatCapacity;
            float standard = baseReload ? reload : reload / (maxUsed * multiplier * 0.4f);
            label.append('\\n').append(liquid.localizedName).append(" ")
                .append(Strings.autoFixed(maxUsed * 60f, 2)).append(StatUnit.perSecond.localized()).append(" ")
                .append(Core.bundle.format("bullet.reload", Strings.autoFixed(standard / (reload / rate) * 100f, 2)));
        }
        return label.toString();
    }

    private static String speedBoosterText(String unit, float amount, float speed, boolean strength, Boolf<Liquid> filter){
        StringBuilder label = new StringBuilder();
        for(var liquid : content.liquids()){
            if(!filter.get(liquid)) continue;
            label.append('\\n').append(liquid.localizedName).append(" ")
                .append(Strings.autoFixed(amount * 60f, 2)).append(StatUnit.perSecond.localized());
            if(speed != Float.MAX_VALUE){
                float result = speed * (strength ? liquid.heatCapacity : 1f) + (strength ? 1f : 0f);
                label.append(" ").append(unit.replace("{0}", Strings.autoFixed(result, 2)));
            }
        }
        return label.toString();
    }

    private static String itemBoosterText(String unit, float period, float speed, float range, ItemStack[] items){
        StringBuilder label = new StringBuilder(itemStatText(items, period, period >= 0));
        if(range != 0) label.append(" +").append(Strings.autoFixed(range / tilesize, 2)).append(" ").append(StatUnit.blocks.localized());
        if(speed != 0) label.append(" ").append(unit.replace("{0}", Strings.autoFixed(speed, 2)));
        return label.toString();
    }

    private static Seq<Block> terrainStatBlocks(Attribute attr, boolean floating, boolean checkFloors){
        return Vars.content.blocks()
            .select(block -> (!checkFloors || block instanceof Floor) && indexer.isBlockPresent(block)
                && block.attributes.get(attr) != 0 && !((block instanceof Floor floor && floor.isDeep()) && !floating))
            .with(blocks -> blocks.sort(block -> block.attributes.get(attr)));
    }

    private static String terrainEfficiencyText(Attribute attr, boolean floating, float scale, boolean startZero, boolean checkFloors){
        if(!state.isGame()) return Core.bundle.get("stat.showinmap");
        StringBuilder label = new StringBuilder();
        for(var block : terrainStatBlocks(attr, floating, checkFloors)){
            float multiplier = block.attributes.get(attr) * scale;
            label.append('\\n').append(block.localizedName).append(" ");
            if(multiplier >= 0 && !startZero) label.append("+");
            label.append((int)(multiplier * 100)).append("%");
        }
        return label.length() == 0 ? Core.bundle.get("none.inmap") : label.toString();
    }

    private static String terrainOutputText(Attribute attr, boolean floating, float scaleEff, float scaleAmount,
        Seq<ItemStack> outputs, float period, boolean checkFloors){
        if(!state.isGame()) return Core.bundle.get("stat.showinmap");
        StringBuilder label = new StringBuilder();
        for(var block : terrainStatBlocks(attr, floating, checkFloors)){
            float attribute = block.attributes.get(attr);
            float efficiency = 1f + attribute * scaleEff;
            label.append('\\n').append(block.localizedName).append(" ");
            if(outputs == null || outputs.isEmpty()){
                label.append(Core.bundle.get("none")).append(" ");
            }else{
                for(var output : outputs){
                    float amount = output.amount * (1f + attribute * scaleAmount);
                    float rate = amount / ((period / efficiency) / 60f);
                    label.append(output.item.localizedName).append(" ")
                        .append(Strings.autoFixed(rate, 3)).append(StatUnit.perSecond.localized()).append(" ");
                }
            }
            label.append(Core.bundle.format("stat.efficiency", fixValue(efficiency * 100f)));
        }
        return label.length() == 0 ? Core.bundle.get("none.inmap") : label.toString();
    }

    private static String weaponStatText(UnitType unit, Seq<Weapon> weapons){
        StringBuilder label = new StringBuilder();
        for(int index = 0; index < weapons.size; index++){
            Weapon weapon = weapons.get(index);
            if(weapon.flipSprite || !weapon.hasStats(unit)) continue;
            String info = "unit." + unit.name + ".weapon." + index + ".info";
            if(Core.bundle.has(info)) label.append('\\n').append(Core.bundle.get(info));
            if(weapon.inaccuracy > 0){
                label.append('\\n').append(Stat.inaccuracy.localized()).append(": ")
                    .append((int)weapon.inaccuracy).append(" ").append(StatUnit.degrees.localized());
            }
            if(!weapon.alwaysContinuous && weapon.reload > 0 && !weapon.bullet.killShooter){
                label.append('\\n').append(Stat.reload.localized()).append(": ").append(weapon.mirror ? "2x " : "")
                    .append(Strings.autoFixed(60f / weapon.reload * weapon.shoot.shots, 2))
                    .append(" ").append(StatUnit.perSecond.localized());
            }
            label.append(ammoStatText(ObjectMap.of(unit, weapon.bullet), false, false, null));
        }
        return label.toString();
    }

    private static void appendAmmoLine(StringBuilder label, String line){
        label.append('\\n').append(line.startsWith("@") ? Core.bundle.get(line.substring(1)) : line);
    }

    private static <T extends UnlockableContent> String ammoStatText(ObjectMap<T, BulletType> map, boolean nested, boolean showUnit, String blockName){
        StringBuilder label = new StringBuilder();
        var keys = map.keys().toSeq();
        keys.sort();
        for(T t : keys){
            boolean compact = t instanceof UnitType && !showUnit || nested;
            BulletType type = map.get(t);
            if(type.spawnUnit != null && type.spawnUnit.weapons.size > 0){
                label.append(ammoStatText(ObjectMap.of(t, type.spawnUnit.weapons.first().bullet), nested, false, blockName));
                continue;
            }
            if(!compact && !(t instanceof Turret)){
                appendAmmoLine(label, t.localizedName);
                if(type.displayAmmoMultiplier && type.statLiquidConsumed > 0f){
                    appendAmmoLine(label, fixValue(type.statLiquidConsumed / type.ammoMultiplier * 60f) + " " + StatUnit.perSecond.localized());
                }
            }
            if(blockName != null && t != null){
                String info = "block." + blockName + "." + t.name + ".info";
                if(Core.bundle.has(info)) appendAmmoLine(label, Core.bundle.get(info));
            }
''' + ammoRules + '''            if(type.intervalBullet != null){
                appendAmmoLine(label, Core.bundle.format("bullet.interval", Strings.autoFixed(type.intervalBullets / type.bulletInterval * 60, 2)));
                label.append(ammoStatText(ObjectMap.of(t, type.intervalBullet), true, false, null));
            }
            if(type.fragBullet != null){
                appendAmmoLine(label, Core.bundle.format("bullet.frags", type.fragBullets));
                label.append(ammoStatText(ObjectMap.of(t, type.fragBullet), true, false, null));
            }
            if(type.spawnBullets != null && type.spawnBullets.size > 0){
                appendAmmoLine(label, Core.bundle.format("bullet.spawnBullets", type.spawnBullets.size));
                for(BulletType spawn : type.spawnBullets){
                    if(spawn.showStats) label.append(ammoStatText(ObjectMap.of(t, spawn), true, false, null));
                }
            }
        }
        return label.toString();
    }

