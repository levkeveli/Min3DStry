import java.security.MessageDigest

plugins {
    id 'java'
    id 'org.teavm' version '0.16.0'
}

repositories { mavenCentral() }

def revision = '19a0f40d44514f4802a8b79770456e7e32e34da0'
def upstreamFile = 'core/src/mindustry/logic/LogicOp.java'
def blockSource = 'core/src/mindustry/world/Block.java'
def annotationsSource = 'annotations/src/main/java/mindustry/annotations/Annotations.java'
def arcRevision = '7445105cd2683daf5b9ac7033ebb07265d3e814d'
def fileSource = 'arc-core/src/arc/files/Fi.java'
def osSource = 'arc-core/src/arc/util/OS.java'
def networkIoSource = 'core/src/mindustry/net/NetworkIO.java'
def netClientSource = 'core/src/mindustry/core/NetClient.java'
def placementSource = 'core/src/mindustry/ui/fragments/PlacementFragment.java'
def itemSelectionSource = 'core/src/mindustry/world/blocks/ItemSelection.java'
def planetGridSource = 'core/src/mindustry/graphics/g3d/PlanetGrid.java'
def pixmapSource = 'arc-core/src/arc/graphics/Pixmap.java'
def jsonSource = 'arc-core/src/arc/util/serialization/Json.java'
def pixmapPatch = file('patches/arc-pixmap-direct-buffer.patch')
def glacier = 'core/assets/maps/default/glacier.msav'
def upstream = providers.gradleProperty('upstreamCheckout')
def arc = providers.gradleProperty('arcCheckout')
def probe = providers.gradleProperty('probe').getOrElse('logic')
def entryPoints = [
    logic: 'mindustry.logic.UpstreamLogicProbe',
    map: 'mindustry.maps.UpstreamMapProbe',
    'map-sd': 'mindustry.maps.UpstreamSdMapProbe',
    content: 'UpstreamContentBaseline',
    resource: 'port.UpstreamResourceProbe',
    executor: 'port.concurrent.UpstreamExecutorProbe',
    'content-init': 'UpstreamContentInitializationProbe',
    world: 'UpstreamWorldLoadProbe',
    'world-save': 'UpstreamWorldSaveProbe',
    'world-roundtrip': 'UpstreamWorldRoundTripProbe',
    'factory-ticks': 'UpstreamFactoryTickProbe',
    'combat-ticks': 'UpstreamCombatTickProbe',
    'production-ticks': 'UpstreamProductionTickProbe',
    'wave-routing': 'UpstreamWaveRoutingProbe',
    'world-stream': 'UpstreamWorldStreamProbe',
    'network-live': 'UpstreamLiveNetworkProbe',
    'network-render': 'UpstreamRenderedNetworkProbe',
    'terrain-draw': 'UpstreamTerrainDrawProbe',
    'terrain-render': 'UpstreamTerrainRenderProbe',
    'file-metadata': 'port.UpstreamFileMetadataProbe',
    'campaign-settings': 'UpstreamCampaignSettingsProbe',
    'campaign-sector': 'UpstreamCampaignSectorProbe',
    'campaign-content': 'UpstreamCampaignContentStateProbe',
    'campaign-research': 'UpstreamCampaignResearchStateProbe',
    'campaign-slot-meta': 'UpstreamCampaignSlotMetaProbe',
    'campaign-sector-info': 'UpstreamCampaignSectorInfoProbe'
]
if (!entryPoints.containsKey(probe)) {
    throw new GradleException("Expected -Pprobe to be one of ${entryPoints.keySet()}")
}
def entryPoint = entryPoints[probe]
def usesMapSources = probe in ['map', 'map-sd']
def usesLiveNetwork = probe in ['network-live', 'network-render']
def usesTerrainRenderer = probe in ['terrain-render', 'network-render']
def patchesPlanetGrid = probe == 'network-render'
def usesSimulation = probe in ['factory-ticks', 'combat-ticks', 'production-ticks', 'wave-routing']
def usesCampaignSettings = probe == 'campaign-settings'
def usesCampaignSector = probe == 'campaign-sector'
def usesCampaignContent = probe == 'campaign-content'
def usesCampaignResearch = probe == 'campaign-research'
def usesCampaignSlotMeta = probe == 'campaign-slot-meta'
def usesCampaignSectorInfo = probe == 'campaign-sector-info'
def usesWorldSources = probe in ['world', 'world-save', 'world-roundtrip', 'world-stream',
                                 'terrain-draw'] || usesCampaignSector || usesCampaignSlotMeta || usesLiveNetwork || usesTerrainRenderer || usesSimulation
def initializesContent = probe == 'content-init' || usesWorldSources || usesCampaignContent || usesCampaignResearch || usesCampaignSectorInfo
def usesContentSources = probe == 'content' || initializesContent
def usesExecutor = usesContentSources || probe == 'executor' || usesCampaignSettings
def usesArcSources = usesContentSources || probe == 'resource' || usesCampaignSettings
def usesWorldStream = probe == 'world-stream' || usesLiveNetwork
def pluginsToLoad = []
if (usesArcSources) pluginsToLoad.add('port.ResourceVirtualMethods')
if (usesExecutor) pluginsToLoad.add('port.concurrent.ArcPoolSupport')
if (usesWorldSources || usesCampaignSectorInfo) {
    pluginsToLoad.add('port.AnonymousClassSupport')
}
if (usesWorldSources) {
    pluginsToLoad.add('port.WorldProbeSupport')
}
def referenceJar = file(providers.gradleProperty('referenceJar').getOrElse('server-release.jar'))
def sourceDir = layout.buildDirectory.dir("upstream-src/${probe}")
def sourceFile = sourceDir.map { it.file('mindustry/logic/LogicOp.java') }
def mapFile = sourceDir.map { it.file('mindustry/maps/GlacierFixture.java') }
def blockFile = sourceDir.map { it.file('mindustry/world/Block.java') }
def annotationsFile = sourceDir.map { it.file('mindustry/annotations/Annotations.java') }
def arcFile = sourceDir.map { it.file('arc/files/Fi.java') }
def arcOsFile = sourceDir.map { it.file('arc/util/OS.java') }
def arcPixmapFile = sourceDir.map { it.file('arc/graphics/Pixmap.java') }
def arcJsonFile = sourceDir.map { it.file('arc/util/serialization/Json.java') }
def networkIoFile = sourceDir.map { it.file('mindustry/net/NetworkIO.java') }
def netClientFile = sourceDir.map { it.file('mindustry/core/NetClient.java') }
def placementFile = sourceDir.map { it.file('UpstreamPlacementCatalog.java') }
def itemChoicesFile = sourceDir.map { it.file('UpstreamItemChoices.java') }
def planetGridFile = sourceDir.map { it.file('mindustry/graphics/g3d/PlanetGrid.java') }
def compilerResources = layout.buildDirectory.dir("compiler-resources/${probe}")
def pluginFile = compilerResources.map { it.file('META-INF/services/org.teavm.vm.spi.TeaVMPlugin') }
def reflectionPolicyFile = compilerResources.map { it.file('META-INF/services/org.teavm.extension.spi.reflection.ReflectionPolicy') }
def readUpstream = { path ->
    providers.exec {
        commandLine 'git', '-C', upstream.get(), 'show', "${revision}:${path}"
    }.standardOutput.asBytes.get()
}

if (usesArcSources || usesExecutor) {
    def stagedClasses = []
    if (usesContentSources) {
        stagedClasses.add('mindustry/world/Block.class')
    }
    if (usesArcSources) {
        stagedClasses.addAll(['arc/files/Fi.class', 'arc/files/Fi$*.class'])
    }
    if (usesExecutor) {
        stagedClasses.add('arc/util/OS.class')
    }
    if (initializesContent) {
        stagedClasses.addAll(['arc/graphics/Pixmap.class', 'arc/graphics/Pixmap$*.class'])
    }
    if (usesWorldStream) {
        stagedClasses.add('mindustry/net/NetworkIO.class')
    }
    if (usesLiveNetwork) {
        stagedClasses.addAll(['mindustry/core/NetClient.class', 'mindustry/core/NetClient$*.class'])
    }
    if (patchesPlanetGrid) {
        stagedClasses.addAll(['mindustry/graphics/g3d/PlanetGrid.class', 'mindustry/graphics/g3d/PlanetGrid$*.class'])
    }
    if (usesCampaignSectorInfo) {
        stagedClasses.addAll(['arc/util/serialization/Json.class', 'arc/util/serialization/Json$*.class'])
    }
    // TeaVM resolves dependency classes before compiled project classes.
    def contentDependencies = tasks.register('prepareContentDependencies', Zip) {
        dependsOn 'prepareUpstreamProbe'
        inputs.property('stagedClasses', stagedClasses)
        from(zipTree(referenceJar)) {
            exclude stagedClasses
        }
        destinationDirectory = layout.buildDirectory.dir("probe-dependencies/${probe}")
        archiveFileName = 'server-probe-dependencies.jar'
    }
    dependencies { implementation files(contentDependencies.flatMap { it.archiveFile }).builtBy(contentDependencies) }
} else {
    dependencies { implementation files(referenceJar) }
}
if (usesArcSources) {
    sourceSets.main.java.srcDir('src/resource/java')
}
if (!pluginsToLoad.isEmpty() || usesCampaignSectorInfo) {
    dependencies {
        compileOnly 'org.teavm:teavm-core:0.16.0'
        if (usesCampaignSectorInfo) {
            compileOnly 'org.teavm:teavm-extension-apis:0.16.0'
            compileOnly 'org.teavm:teavm-extension-spi:0.16.0'
        }
    }
    sourceSets.main.resources.srcDir(compilerResources)
    tasks.named('processResources') { dependsOn 'prepareUpstreamProbe' }
}
if (usesExecutor) {
    sourceSets.main.java.srcDir('src/concurrent/java')
}
if (usesContentSources) {
    sourceSets.main.java.srcDirs('host', 'src/content/java')
}
if (usesWorldSources) {
    sourceSets.main.java.srcDir('src/world/java')
}
if (usesTerrainRenderer) {
    sourceSets.main.java.srcDir('src/terrain/java')
}
if (usesSimulation) {
    sourceSets.main.java.srcDir('src/gameplay/java')
}
if (probe == 'world-stream') {
    sourceSets.main.java.srcDir('src/world-stream/java')
}
if (usesLiveNetwork) {
    sourceSets.main.java.srcDirs('src/network-live/java', 'src/network-live/host')
}
if (probe == 'network-render') {
    sourceSets.main.java.srcDir('src/network-render/java')
}
if (probe == 'file-metadata') {
    sourceSets.main.java.srcDir('src/file/java')
}
if (usesCampaignSettings) {
    sourceSets.main.java.srcDir('src/campaign-settings/java')
}
if (usesCampaignSector) {
    sourceSets.main.java.srcDir('src/campaign-sector/java')
}
if (usesCampaignContent) {
    sourceSets.main.java.srcDir('src/campaign-content/java')
}
if (usesCampaignResearch) {
    sourceSets.main.java.srcDir('src/campaign-research/java')
}
if (usesCampaignSlotMeta) {
    sourceSets.main.java.srcDir('src/campaign-slot-meta/java')
}
if (usesCampaignSectorInfo) {
    sourceSets.main.java.srcDirs('src/campaign-sector-info/java')
}
dependencies {
    if (usesMapSources || usesLiveNetwork || usesTerrainRenderer) {
        implementation 'org.teavm:teavm-interop:0.16.0'
    }
}
sourceSets.main.java.srcDir(sourceDir)
if (usesMapSources) {
    sourceSets.main.java.srcDir('src/map/java')
}
tasks.withType(JavaCompile).configureEach { options.release = 17 }

tasks.register('prepareUpstreamProbe') {
    inputs.property('revision', revision)
    inputs.property('upstreamCheckout', upstream)
    inputs.property('probe', probe)
    inputs.file(referenceJar)
    if (!pluginsToLoad.isEmpty()) {
        inputs.property('compilerPlugins', pluginsToLoad)
        outputs.file(pluginFile)
    }
    outputs.file(sourceFile)
    if (usesMapSources) {
        outputs.file(mapFile)
    }
    if (usesContentSources) {
        outputs.files(blockFile, annotationsFile)
    }
    if (usesArcSources || usesExecutor) {
        inputs.property('arcRevision', arcRevision)
        inputs.property('arcCheckout', arc)
    }
    if (usesArcSources) {
        outputs.file(arcFile)
    }
    if (usesExecutor) {
        outputs.file(arcOsFile)
    }
    if (initializesContent) {
        inputs.file(pixmapPatch)
        outputs.file(arcPixmapFile)
    }
    if (usesWorldStream) {
        outputs.file(networkIoFile)
    }
    if (usesLiveNetwork) {
        outputs.files(netClientFile, placementFile, itemChoicesFile)
    }
    if (patchesPlanetGrid) {
        outputs.file(planetGridFile)
    }
    if (usesCampaignSectorInfo) {
        outputs.files(reflectionPolicyFile, arcJsonFile)
    }
    doLast {
        if (!pluginsToLoad.isEmpty()) {
            def service = pluginFile.get().asFile
            service.parentFile.mkdirs()
            service.setText(pluginsToLoad.join('\n') + '\n', 'UTF-8')
        }
        if (usesCampaignSectorInfo) {
            def policy = reflectionPolicyFile.get().asFile
            policy.parentFile.mkdirs()
            policy.setText('port.SectorInfoReflectionPolicy\n', 'UTF-8')
        }
        def sha256 = MessageDigest.getInstance('SHA-256').digest(referenceJar.bytes).encodeHex().toString()
        if (sha256 != 'faeaf247a8b622de940181a96cb21cb20692d3c3da4e8ac3f79cb4af5059aa6c') {
            throw new GradleException('Expected the official v160.8 server-release.jar')
        }
        def output = sourceFile.get().asFile
        output.parentFile.mkdirs()
        output.bytes = readUpstream(upstreamFile)
        if (usesMapSources) {
            def bytes = readUpstream(glacier)
            def encoded = Base64.encoder.encodeToString(bytes)
            // The fixed fixture fits in a Java class-file string constant.
            if (encoded.length() > 65535) {
                throw new GradleException('Glacier fixture exceeds the class-file string limit')
            }
            def fixture = mapFile.get().asFile
            fixture.parentFile.mkdirs()
            fixture.setText("""package mindustry.maps;
final class GlacierFixture {
    static final String BASE64 = "${encoded}";
}
""", 'UTF-8')
        }
        if (usesContentSources) {
            def block = new String(readUpstream(blockSource), 'UTF-8')
            def anonymousCheck = 'current.isAnonymousClass()'
            if (block.count(anonymousCheck) != 1) {
                throw new GradleException('Pinned Block.initBuilding anonymous class check changed')
            }
            def adaptedBlock = blockFile.get().asFile
            adaptedBlock.parentFile.mkdirs()
            adaptedBlock.setText(block.replace(anonymousCheck, 'current.getSimpleName().isEmpty()'), 'UTF-8')
            def annotations = annotationsFile.get().asFile
            annotations.parentFile.mkdirs()
            annotations.bytes = readUpstream(annotationsSource)
        }
        if (usesArcSources) {
            def bytes = providers.exec {
                commandLine 'git', '-C', arc.get(), 'show', "${arcRevision}:${fileSource}"
            }.standardOutput.asBytes.get()
            def source = new String(bytes, 'UTF-8')
            def lookup = '''return Fi.class.getResource("/" + file.getPath().replace('\\\\', '/')) != null;'''
            def streamLookup = '''try (InputStream input = Fi.class.getResourceAsStream("/" + file.getPath().replace('\\\\', '/'))) {
                    return input != null;
                } catch (IOException error) {
                    return false;
                }'''
            if (source.count(lookup) != 1) {
                throw new GradleException('Pinned Arc Fi.exists resource lookup changed')
            }
            def adapted = arcFile.get().asFile
            adapted.parentFile.mkdirs()
            adapted.setText(source.replace(lookup, streamLookup), 'UTF-8')
        }
        if (usesExecutor) {
            def bytes = providers.exec {
                commandLine 'git', '-C', arc.get(), 'show', "${arcRevision}:${osSource}"
            }.standardOutput.asBytes.get()
            def source = new String(bytes, 'UTF-8')
            def processorCount = 'Runtime.getRuntime().availableProcessors()'
            if (source.count(processorCount) != 1) {
                throw new GradleException('Pinned Arc OS processor count changed')
            }
            def adapted = arcOsFile.get().asFile
            adapted.parentFile.mkdirs()
            // TeaVM C runs its managed threads on one execution lane.
            adapted.setText(source.replace(processorCount, '1'), 'UTF-8')
        }
        if (initializesContent) {
            def bytes = providers.exec {
                commandLine 'git', '-C', arc.get(), 'show', "${arcRevision}:${pixmapSource}"
            }.standardOutput.asBytes.get()
            def staged = arcPixmapFile.get().asFile
            staged.parentFile.mkdirs()
            staged.bytes = bytes
            providers.exec {
                commandLine 'git', '-C', sourceDir.get().asFile, 'apply', '--no-index', pixmapPatch
            }.result.get()
        }
        if (usesCampaignSectorInfo) {
            def source = new String(providers.exec {
                commandLine 'git', '-C', arc.get(), 'show', "${arcRevision}:${jsonSource}"
            }.standardOutput.asBytes.get(), 'UTF-8')
            def reflective = 'return type.getDeclaredConstructor().newInstance();'
            def accessibility = 'if(!field.isAccessible()){'
            if (source.count(reflective) != 1 || source.count(accessibility) != 1) {
                throw new GradleException('Pinned Arc Json reflection hooks changed')
            }
            // TeaVM instantiates retained classes directly and reports public fields inaccessible.
            source = source.replace(reflective, 'return type.newInstance();')
            source = source.replace(accessibility, 'if(false){')
            def adapted = arcJsonFile.get().asFile
            adapted.parentFile.mkdirs()
            adapted.setText(source, 'UTF-8')
        }
        if (usesWorldStream) {
            def source = new String(readUpstream(networkIoSource), 'UTF-8')
            def signature = 'public static void loadWorld(InputStream is){'
            def addRemoved = 'netClient.addRemovedEntity(e.id())'
            if (source.count(signature) != 1 || source.count(addRemoved) != 2) {
                throw new GradleException('Pinned NetworkIO world receiver changed')
            }
            def outputNetworkIo = networkIoFile.get().asFile
            outputNetworkIo.parentFile.mkdirs()
            outputNetworkIo.setText(source.replace(signature, '''public static void loadWorld(InputStream is){
        loadWorld(is, netClient::addRemovedEntity);
    }

    public static void loadWorld(InputStream is, arc.func.Intc recordEntity){''')
                .replace(addRemoved, 'recordEntity.get(e.id())'), 'UTF-8')
        }
        if (patchesPlanetGrid) {
            def grid = new String(readUpstream(planetGridSource), 'UTF-8')
            def create = 'public static synchronized PlanetGrid create(int size){'
            if (grid.count(create) != 1) {
                throw new GradleException('Pinned PlanetGrid cache methods changed')
            }
            def adaptedGrid = planetGridFile.get().asFile
            adaptedGrid.parentFile.mkdirs()
            // This synchronous path never yields on TeaVM C's single execution lane.
            // Its cache and subdivision stay atomic without the failing Java monitor.
            adaptedGrid.setText(grid.replace(create, 'public static PlanetGrid create(int size){'), 'UTF-8')
        }
        if (usesLiveNetwork) {
            def source = new String(readUpstream(netClientSource), 'UTF-8')
            def buffer = '''private ReusableByteInStream byteStream = new ReusableByteInStream();
    private DataInputStream dataStream = new DataInputStream(byteStream);
    private Reads dataStreamReads = new Reads(dataStream);'''
            def constructor = 'public NetClient(){'
            if (source.count(buffer) != 1 || source.count(constructor) != 1) {
                throw new GradleException('Pinned NetClient snapshot reader changed')
            }
            def outputClient = netClientFile.get().asFile
            outputClient.parentFile.mkdirs()
            outputClient.setText(source.replace(buffer, '''private final ReusableByteInStream byteStream;
    private final DataInputStream dataStream;
    private final Reads dataStreamReads;''').replace(constructor, '''private NetClient(ReusableByteInStream snapshotInput){
        byteStream = snapshotInput;
        dataStream = new DataInputStream(byteStream);
        dataStreamReads = new Reads(dataStream);
    }

    /** Used when another frontend owns packet dispatch and connection UI. */
    public static NetClient forSnapshotDispatch(){
        return new NetClient(new ReusableByteInStream());
    }

    public NetClient(){
        this(new ReusableByteInStream());'''), 'UTF-8')
            def placement = new String(readUpstream(placementSource), 'UTF-8')
            def selection = placement =~ /(?m)^    Seq<Block> getUnlockedByCategory\(Category cat\)\{[\s\S]*?^    \}/
            def unlocked = placement =~ /(?m)^    boolean unlocked\(Block block\)\{[\s\S]*?^    \}/
            if (selection.count != 1 || unlocked.count != 1) {
                throw new GradleException('Pinned PlacementFragment catalog methods changed')
            }
            placementFile.get().asFile.setText("""// Selection rules from pinned upstream PlacementFragment.java (GPL-3.0).
import arc.struct.Seq;
import mindustry.type.Category;
import mindustry.world.Block;
import static mindustry.Vars.*;

final class UpstreamPlacementCatalog {
    private final Seq<Block> returnArray2 = new Seq<>();

${selection[0]}

${unlocked[0]}
}
""", 'UTF-8')
            def itemSelection = new String(readUpstream(itemSelectionSource), 'UTF-8')
            def filter = itemSelection =~ /(?m)^\s*if\(([^\r\n]+)\) continue;\r?$/
            if (filter.count != 1) {
                throw new GradleException('Pinned ItemSelection eligibility check changed')
            }
            itemChoicesFile.get().asFile.setText("""// Eligibility from pinned upstream ItemSelection.java (GPL-3.0).
import mindustry.ctype.UnlockableContent;
import static mindustry.Vars.state;

final class UpstreamItemChoices {
    static boolean accepts(UnlockableContent item) {
        if (${filter[0][1]}) return false;
        return true;
    }
}
""", 'UTF-8')
        }
    }
}

tasks.named('compileJava') { dependsOn 'prepareUpstreamProbe' }

tasks.register('runProbeJvm', JavaExec) {
    dependsOn 'classes'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = ['map-sd': entryPoints.map, 'terrain-render': entryPoints['terrain-draw'],
                 'network-live': 'UpstreamSnapshotDispatchReference',
                 'network-render': 'UpstreamSnapshotDispatchReference']
        .getOrDefault(probe, entryPoint)
    def probeArgs = providers.gradleProperty('probeArgs')
    if (probeArgs.isPresent()) {
        args(probeArgs.get().trim().split('\\s+').toList())
    }
}

if (usesLiveNetwork) {
    tasks.register('runBuildControlsJvm', JavaExec) {
        dependsOn 'classes'
        classpath = sourceSets.main.runtimeClasspath
        mainClass = 'UpstreamBuildControlsReference'
    }
}

if (usesContentSources) {
    tasks.register('runBuildingProbeJvm', JavaExec) {
        dependsOn 'classes'
        classpath = sourceSets.main.runtimeClasspath
        mainClass = 'UpstreamBuildingBaseline'
        workingDir = layout.buildDirectory.dir('content-reference').get().asFile
        doFirst { workingDir.mkdirs() }
    }
}

teavm {
    all { mainClass = entryPoint }
    if (usesExecutor) {
        c { obfuscated = false }
    }
    if (usesSimulation) {
        c { maxHeapSize = 24 }
    }
}

if (usesWorldSources) {
    apply from: 'gradle/world-compiler.gradle'
    tasks.register('makeWorldSaveFixture', JavaExec) {
        classpath = sourceSets.main.runtimeClasspath
        mainClass = 'UpstreamCurrentSaveFixture'
    }
}
