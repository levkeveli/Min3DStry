            hooks['    public static String fixValue(float value){'] = '''    private static String itemStatText(ItemStack[] stacks, float period, boolean rate){
        StringBuilder label = new StringBuilder();
        for(var stack : stacks){
            if(label.length() != 0) label.append(" / ");
