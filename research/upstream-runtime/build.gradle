                globalVars = globalVars.replace('import arc.*;', 'import port.logic.UpstreamClientLogic;\n\nimport arc.*;')
                    .replace(stockIds, 'UpstreamClientLogic.logicIds()')
            }
            def adaptedGlobalVars = globalVarsFile.get().asFile
            adaptedGlobalVars.parentFile.mkdirs()
            def musicController = usesLiveAudio ? 'Arm11Audio.musicControl()' : 'null'
            if (usesLiveAudio) {
                globalVars = globalVars.replace('package mindustry.logic;', 'package mindustry.logic;\n\nimport port.audio.Arm11Audio;')
            }
            adaptedGlobalVars.setText(globalVars.replace(soundCheck, """var musicController = control != null ? control.sound : ${musicController};
            varClientMusicPlaying.numval = musicController != null && musicController.isPlaying() ? 1 : 0;

            var music = musicController != null ? musicController.getCurrent() : null;"""), 'UTF-8')
        }
        if (usesSinglePlayer) {
            def copiedFactoryResources = factoryResourcesFile.get().asFile
            copiedFactoryResources.parentFile.mkdirs()
            copiedFactoryResources.setText(file('src/gameplay/java/port/FactoryResources.java').getText('UTF-8'), 'UTF-8')
        }
    }
}

tasks.named('compileJava') { dependsOn 'prepareUpstreamProbe' }

tasks.register('runProbeJvm', JavaExec) {
    dependsOn 'classes'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = ['map-sd': entryPoints.map, 'terrain-render': entryPoints['terrain-draw'],
                 'network-live': 'UpstreamSnapshotDispatchReference',
                   'network-render': 'UpstreamSnapshotDispatchReference',
                   'unified': 'UpstreamSnapshotDispatchReference']
        .getOrDefault(probe, entryPoint)
    def probeArgs = providers.gradleProperty('probeArgs')
    if (probeArgs.isPresent()) {
        args(probeArgs.get().trim().split('\\s+').toList())
    }
}

if (usesLiveNetwork) {
    tasks.register('runBuildControlsJvm', JavaExec) {
        dependsOn 'classes'
        classpath = sourceSets.main.runtimeClasspath
        mainClass = 'UpstreamBuildControlsReference'
    }
}

if (usesContentSources) {
    tasks.register('runBuildingProbeJvm', JavaExec) {
        dependsOn 'classes'
        classpath = sourceSets.main.runtimeClasspath
        mainClass = 'UpstreamBuildingBaseline'
        workingDir = layout.buildDirectory.dir('content-reference').get().asFile
        doFirst { workingDir.mkdirs() }
    }
}

teavm {
    all { mainClass = entryPoint }
    if (usesExecutor) {
        c { obfuscated = false }
    }
    if (usesSinglePlayerApp) {
        // Large offline maps allocate the original Pathfinder grid while the
        // decoded world is live, then still need to load the world atlas.
        c { maxHeapSize = 32 }
    } else if (usesSimulation || usesLiveNetwork || usesSinglePlayer) {
        c { maxHeapSize = 24 }
    }
}

if (usesWorldSources) {
    apply from: 'gradle/world-compiler.gradle'
    tasks.register('makeWorldSaveFixture', JavaExec) {
        classpath = sourceSets.main.runtimeClasspath
        mainClass = 'UpstreamCurrentSaveFixture'
    }
}
