name: Main failure alert

on:
  workflow_run:
    workflows:
      - Upstream ARM11 smoke
      - 3DS full build
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: main-failure-alert-${{ github.event.workflow_run.name || github.run_id }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  alert:
    name: Open or update the main failure issue
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.event != 'pull_request' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            if (!run) {
              core.info('No workflow_run payload; nothing to do.');
              return;
            }
            const title = `[main] ${run.name} failed`;
            const shortSha = run.head_sha.slice(0, 7);
            const body = [
              `The **${run.name}** workflow failed on \`main\`.`,
              '',
              `- Run: ${run.html_url}`,
              `- Commit: \`${run.head_sha}\``,
              `- Event: \`${run.event}\``,
              `- Attempt: ${run.run_attempt}`,
              `- Created: ${run.created_at}`,
              '',
              'A failed main run means the merged commit did not pass the emulator/build gate.',
              'Investigate before the next release or hardware handoff; do not treat the commit as verified.',
            ].join('\n');
            const { owner, repo } = context.repo;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body: `Another failure for \`${shortSha}\`:\n\n${body}`,
              });
              core.info(`Updated issue #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({ owner, repo, title, body });
              core.info(`Opened issue #${created.data.number}`);
            }
