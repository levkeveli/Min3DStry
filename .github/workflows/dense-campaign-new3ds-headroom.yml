name: Verify dense campaign with New 3DS release headroom

on:
  push:
    branches: [test/dense-campaign-new3ds-headroom]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-v1-${{ hashFiles('research/upstream-runtime/build.gradle', 'research/upstream-runtime/gradle/**') }}
      - name: Install the stock audio converter
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - run: bash .github/scripts/build_unified_arm11_smoke.sh
      - name: Record exact inputs
        working-directory: build/unified-smoke
        run: |
          git rev-parse HEAD > source-commit.txt
          sha256sum upstream-probe.3dsx server-release.jar > replay-inputs.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: dense-new3ds-release-headroom
          path: build/unified-smoke/
          if-no-files-found: error
          compression-level: 0
  replay:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        sector: [serpulo-242, littoral-shipyard, origin]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/download-artifact@v4
        with:
          name: dense-new3ds-release-headroom
          path: build/unified-smoke
      - name: Verify the archived ROM and stock server
        working-directory: build/unified-smoke
        run: |
          test "$(cat source-commit.txt)" = "$GITHUB_SHA"
          sha256sum --check replay-inputs.sha256
          printf '%s  %s\n' faeaf247a8b622de940181a96cb21cb20692d3c3da4e8ac3f79cb4af5059aa6c server-release.jar |
            sha256sum --check
      - run: bash .github/scripts/setup_smoke_azahar.sh
      - name: Resume, reload and save the original 600 by 600 sector twice
        env:
          SECTOR: ${{ matrix.sector }}
        run: |
          server=build/unified-smoke/server-release.jar
          if [ "$SECTOR" = serpulo-242 ]; then
            scenario=(--dense)
            log=new3ds-multiple.log
          else
            scenario=(--dense-preset "$SECTOR")
            log=new3ds-dense-preset.log
          fi
          python3 tools/campaign_resume_fixtures.py "${scenario[@]}" --server "$server" \
            --output "$RUNNER_TEMP/dense-fixtures"
          if [ "$SECTOR" != serpulo-242 ]; then scenario+=(--from-title); fi
          xvfb-run -a python3 tools/verify_upstream_campaign_resume.py "${scenario[@]}" --dense-resave --model new3ds \
            --rom build/unified-smoke/upstream-probe.3dsx --server "$server" \
            --fixtures "$RUNNER_TEMP/dense-fixtures" --output-dir build/dense-campaign-replay
          result="build/dense-campaign-replay/$log"
          app_heap=$(sed -nE 's/.*UPSTREAM_MEMORY appHeap=([0-9]+).*/\1/p' "$result")
          test "$app_heap" -ge $(((56 + 22) * 1024 * 1024))
          grep -Fx "UPSTREAM_MEMORY managedLimit=$((56 * 1024 * 1024))" \
            <(sed -n 's/.*\(UPSTREAM_MEMORY managedLimit=[0-9]*\).*/\1/p' "$result")
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dense-new3ds-release-headroom-evidence-${{ matrix.sector }}
          path: |
            build/dense-campaign-replay/
            ${{ runner.temp }}/smoke-data/azahar-emu/log/
