name: PR Automation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled, edited]

concurrency:
  group: pr-automation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  policy-gate:
    name: PR policy gate
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.head.repo.fork)) && '["self-hosted", "linux", "x64", "min3dstry"]' || '"ubuntu-latest"') }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr_number: ${{ steps.classify.outputs.pr_number }}
      head_sha: ${{ steps.classify.outputs.head_sha }}
      base_ref: ${{ steps.classify.outputs.base_ref }}
      tier: ${{ steps.classify.outputs.tier }}
      same_repo: ${{ steps.classify.outputs.same_repo }}
      eligible_for_ai_review: ${{ steps.classify.outputs.eligible_for_ai_review }}
      eligible_for_auto_merge: ${{ steps.classify.outputs.eligible_for_auto_merge }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false
      - id: classify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/pr_automation.py classify

  ai-review:
    name: AI review
    needs: [policy-gate]
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.head.repo.fork &&
      needs.policy-gate.outputs.eligible_for_ai_review == 'true'
    runs-on: [self-hosted, linux, x64, min3dstry]
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    outputs:
      approved: ${{ steps.review.outputs.approved }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false
      - id: review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_REVIEW_PROVIDER: ${{ vars.AI_REVIEW_PROVIDER }}
          AI_REVIEW_MODEL: ${{ vars.AI_REVIEW_MODEL }}
          AI_REVIEW_BASE_URL: ${{ vars.AI_REVIEW_BASE_URL }}
        run: >-
          python3 .github/scripts/pr_automation.py ai-review
          --tier "${{ needs.policy-gate.outputs.tier }}"

  auto-merge:
    name: Enable auto-merge
    needs: [policy-gate, ai-review]
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.head.repo.fork &&
      needs.policy-gate.outputs.eligible_for_auto_merge == 'true' &&
      needs.ai-review.outputs.approved == 'true'
    runs-on: [self-hosted, linux, x64, min3dstry]
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python3 .github/scripts/pr_automation.py auto-merge
          --pr-number "${{ needs.policy-gate.outputs.pr_number }}"
          --head-sha "${{ needs.policy-gate.outputs.head_sha }}"
          --tier "${{ needs.policy-gate.outputs.tier }}"
          --eligible "${{ needs.policy-gate.outputs.eligible_for_auto_merge }}"
