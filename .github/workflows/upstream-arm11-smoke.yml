name: Upstream ARM11 smoke

on:
  pull_request:
    branches: [main]
    paths:
      - "research/upstream-runtime/**"
      - "audio/**"
      - "tools/build_audio_assets.py"
      - "tools/verify_upstream_net.py"
      - "tests/tools/test_audio_assets.py"
      - "src/net/mindustry_net.c"
      - "tests/net/**"
      - ".github/workflows/upstream-arm11-smoke.yml"
  push:
    branches: [main]
    paths:
      - "research/upstream-runtime/**"
      - "audio/**"
      - "tools/build_audio_assets.py"
      - "tools/verify_upstream_net.py"
      - "tests/tools/test_audio_assets.py"
      - "src/net/mindustry_net.c"
      - "tests/net/**"
      - ".github/workflows/upstream-arm11-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Probe ${{ matrix.probe }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: upstream-arm11-${{ github.ref }}-${{ matrix.probe }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        probe: [logic, map, resource, executor, campaign-settings]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Fetch pinned upstream v160.8 source and server JAR
        run: |
          git clone --depth 1 --branch v160.8 \
            https://github.com/Anuken/Mindustry.git "$RUNNER_TEMP/Mindustry"
          test "$(git -C "$RUNNER_TEMP/Mindustry" rev-parse HEAD)" = \
            "19a0f40d44514f4802a8b79770456e7e32e34da0"
          curl --fail --silent --show-error --location \
            https://github.com/Anuken/Mindustry/releases/download/v160.8/server-release.jar \
            -o "$RUNNER_TEMP/server-release.jar"

      - name: Fetch pinned Arc source
        if: matrix.probe == 'resource' || matrix.probe == 'executor' || matrix.probe == 'campaign-settings'
        run: |
          git clone --filter=blob:none --no-checkout \
            https://github.com/Anuken/Arc.git "$RUNNER_TEMP/Arc"
          git -C "$RUNNER_TEMP/Arc" fetch --depth 1 origin \
            7445105cd2683daf5b9ac7033ebb07265d3e814d
          git -C "$RUNNER_TEMP/Arc" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/Arc" rev-parse HEAD)" = \
            "7445105cd2683daf5b9ac7033ebb07265d3e814d"

      - name: Run JVM reference and generate TeaVM C
        shell: bash
        run: |
          set -o pipefail
          extra=()
          if [ "${{ matrix.probe }}" = "resource" ] || [ "${{ matrix.probe }}" = "executor" ] || [ "${{ matrix.probe }}" = "campaign-settings" ]; then
            extra=("-ParcCheckout=$RUNNER_TEMP/Arc")
          fi
          bash "$RUNNER_TEMP/Mindustry/gradlew" -p research/upstream-runtime \
            --no-daemon --console=plain \
            "-PupstreamCheckout=$RUNNER_TEMP/Mindustry" \
            "-PreferenceJar=$RUNNER_TEMP/server-release.jar" \
            -Pprobe=${{ matrix.probe }} \
            "${extra[@]}" \
            runProbeJvm generateC | tee "$RUNNER_TEMP/probe.log"
          if [ "${{ matrix.probe }}" = "resource" ]; then
            grep -F 'UPSTREAM_RESOURCE size=709 crc32=3921318438 classpath=ok internal=ok missing=ok' \
              "$RUNNER_TEMP/probe.log"
          fi
          if [ "${{ matrix.probe }}" = "executor" ]; then
            grep -Fx 'UPSTREAM_EXECUTOR_POOLS bounded=ok unbounded=ok' "$RUNNER_TEMP/probe.log"
          fi
          if [ "${{ matrix.probe }}" = "campaign-settings" ]; then
            grep -F 'campaign=unlocked:conveyor,research:50 reload=ok' "$RUNNER_TEMP/probe.log"
          fi

      - name: Build ARM11 probe with pinned devkitARM image
        run: |
          image=devkitpro/devkitarm@sha256:116afba8df8453961de2936ffab20dd441edf4d682856c1ec8b0e53d7ed0bbf5
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/work" -w /work "$image" bash -lc '
            source /opt/devkitpro/3dsvars.sh
            bash research/upstream-runtime/arm11/build.sh \
              research/upstream-runtime/build/generated/teavm/c \
              research/upstream-runtime/build/probe-3ds'
          test -s research/upstream-runtime/build/probe-3ds/upstream-probe.3dsx
          test -s research/upstream-runtime/build/probe-3ds/upstream-probe.elf

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: upstream-arm11-${{ matrix.probe }}
          path: |
            research/upstream-runtime/build/probe-3ds/upstream-probe.3dsx
            research/upstream-runtime/build/probe-3ds/upstream-probe.elf
          if-no-files-found: error

  save-baseline:
    name: Save writer baseline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Fetch pinned upstream map and server JAR
        run: |
          git clone --depth 1 --branch v160.8 \
            https://github.com/Anuken/Mindustry.git "$RUNNER_TEMP/Mindustry"
          test "$(git -C "$RUNNER_TEMP/Mindustry" rev-parse HEAD)" = \
            "19a0f40d44514f4802a8b79770456e7e32e34da0"
          git -C "$RUNNER_TEMP/Mindustry" show \
            HEAD:core/assets/maps/default/glacier.msav > "$RUNNER_TEMP/glacier.msav"
          curl --fail --silent --show-error --location \
            https://github.com/Anuken/Mindustry/releases/download/v160.8/server-release.jar \
            -o "$RUNNER_TEMP/server-release.jar"

      - name: Run upstream SaveIO writer baseline
        run: |
          java -cp "$RUNNER_TEMP/server-release.jar" \
            research/upstream-runtime/host/UpstreamSaveBaseline.java \
            "$RUNNER_TEMP/glacier.msav" | tee "$RUNNER_TEMP/save.log"
          grep -F 'UPSTREAM_SAVE header=MSAV version=13' "$RUNNER_TEMP/save.log"

      - name: Compile save resilience probe
        run: |
          mkdir -p "$RUNNER_TEMP/save-resilience"
          javac -cp "$RUNNER_TEMP/server-release.jar" \
            -d "$RUNNER_TEMP/save-resilience" \
            research/upstream-runtime/host/UpstreamSaveResilienceProbe.java

      - name: Run save resilience checks
        run: |
          java -cp "$RUNNER_TEMP/server-release.jar:$RUNNER_TEMP/save-resilience" \
            UpstreamSaveResilienceProbe "$RUNNER_TEMP/glacier.msav" \
            | tee "$RUNNER_TEMP/save-resilience.log"
          grep -F 'UPSTREAM_SAVE_RESILIENCE_PASS' "$RUNNER_TEMP/save-resilience.log"
          for record in valid=ok truncated=rejected bad_header=rejected \
              unknown_version=rejected backup=recovered; do
            grep -F "UPSTREAM_SAVE_RESILIENCE $record" "$RUNNER_TEMP/save-resilience.log"
          done
          grep -F 'MIN3DSTRY_SAVE_POLICY existing=protected' "$RUNNER_TEMP/save-resilience.log"
          grep -F 'MIN3DSTRY_SAVE_POLICY interrupted=rejected' "$RUNNER_TEMP/save-resilience.log"

  world-roundtrip:
    name: World save round trip
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Fetch pinned upstream source, map, server JAR and Arc
        run: |
          git clone --depth 1 --branch v160.8 \
            https://github.com/Anuken/Mindustry.git "$RUNNER_TEMP/Mindustry"
          test "$(git -C "$RUNNER_TEMP/Mindustry" rev-parse HEAD)" = \
            "19a0f40d44514f4802a8b79770456e7e32e34da0"
          git -C "$RUNNER_TEMP/Mindustry" show \
            HEAD:core/assets/maps/default/glacier.msav > "$RUNNER_TEMP/glacier.msav"
          curl --fail --silent --show-error --location \
            https://github.com/Anuken/Mindustry/releases/download/v160.8/server-release.jar \
            -o "$RUNNER_TEMP/server-release.jar"
          git clone --filter=blob:none --no-checkout \
            https://github.com/Anuken/Arc.git "$RUNNER_TEMP/Arc"
          git -C "$RUNNER_TEMP/Arc" fetch --depth 1 origin \
            7445105cd2683daf5b9ac7033ebb07265d3e814d
          git -C "$RUNNER_TEMP/Arc" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/Arc" rev-parse HEAD)" = \
            "7445105cd2683daf5b9ac7033ebb07265d3e814d"

      - name: Generate v13 fixture and run JVM round trip
        shell: bash
        run: |
          set -o pipefail
          map="$RUNNER_TEMP/glacier.msav"
          v13="$RUNNER_TEMP/glacier-v13.msav"
          out="$RUNNER_TEMP/glacier-roundtrip.msav"
          bash "$RUNNER_TEMP/Mindustry/gradlew" -p research/upstream-runtime \
            --no-daemon --console=plain \
            "-PupstreamCheckout=$RUNNER_TEMP/Mindustry" \
            "-PreferenceJar=$RUNNER_TEMP/server-release.jar" \
            "-ParcCheckout=$RUNNER_TEMP/Arc" \
            -Pprobe=world-roundtrip \
            makeWorldSaveFixture "--args=$map $v13"
          bash "$RUNNER_TEMP/Mindustry/gradlew" -p research/upstream-runtime \
            --no-daemon --console=plain \
            "-PupstreamCheckout=$RUNNER_TEMP/Mindustry" \
            "-PreferenceJar=$RUNNER_TEMP/server-release.jar" \
            "-ParcCheckout=$RUNNER_TEMP/Arc" \
            -Pprobe=world-roundtrip \
            runProbeJvm "--args=$map $v13 $out" | tee "$RUNNER_TEMP/roundtrip.log"
          grep -F 'UPSTREAM_SAVE_ROUNDTRIP version=13 marker=ok' "$RUNNER_TEMP/roundtrip.log"

      - name: Run sector slot JVM round trip
        shell: bash
        run: |
          set -o pipefail
          map="$RUNNER_TEMP/glacier.msav"
          v13="$RUNNER_TEMP/glacier-v13.msav"
          slot="$RUNNER_TEMP/sector-serpulo-170.msav"
          bash "$RUNNER_TEMP/Mindustry/gradlew" -p research/upstream-runtime \
            --no-daemon --console=plain \
            "-PupstreamCheckout=$RUNNER_TEMP/Mindustry" \
            "-PreferenceJar=$RUNNER_TEMP/server-release.jar" \
            "-ParcCheckout=$RUNNER_TEMP/Arc" \
            -Pprobe=campaign-sector \
            runProbeJvm "--args=$map $v13 $slot" | tee "$RUNNER_TEMP/sector.log"
          grep -F 'UPSTREAM_CAMPAIGN_SECTOR slot=sector-serpulo-170.msav' "$RUNNER_TEMP/sector.log"
          grep -F 'version=13 marker=ok' "$RUNNER_TEMP/sector.log"

      - name: Generate and build the ARM11 round-trip probe
        run: |
          bash "$RUNNER_TEMP/Mindustry/gradlew" -p research/upstream-runtime \
            --no-daemon --console=plain \
            "-Dorg.gradle.jvmargs=-Xmx3g" \
            "-PupstreamCheckout=$RUNNER_TEMP/Mindustry" \
            "-PreferenceJar=$RUNNER_TEMP/server-release.jar" \
            "-ParcCheckout=$RUNNER_TEMP/Arc" \
            -Pprobe=world-roundtrip generateC
          image=devkitpro/devkitarm@sha256:116afba8df8453961de2936ffab20dd441edf4d682856c1ec8b0e53d7ed0bbf5
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/work" -w /work "$image" bash -lc '
            source /opt/devkitpro/3dsvars.sh
            bash research/upstream-runtime/arm11/build.sh \
              research/upstream-runtime/build/generated/teavm/c \
              research/upstream-runtime/build/probe-3ds-world-roundtrip'
          test -s research/upstream-runtime/build/probe-3ds-world-roundtrip/upstream-probe.3dsx

      - name: Generate and build the ARM11 sector-slot probe
        run: |
          bash "$RUNNER_TEMP/Mindustry/gradlew" -p research/upstream-runtime \
            --no-daemon --console=plain \
            "-Dorg.gradle.jvmargs=-Xmx3g" \
            "-PupstreamCheckout=$RUNNER_TEMP/Mindustry" \
            "-PreferenceJar=$RUNNER_TEMP/server-release.jar" \
            "-ParcCheckout=$RUNNER_TEMP/Arc" \
            -Pprobe=campaign-sector generateC
          image=devkitpro/devkitarm@sha256:116afba8df8453961de2936ffab20dd441edf4d682856c1ec8b0e53d7ed0bbf5
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/work" -w /work "$image" bash -lc '
            source /opt/devkitpro/3dsvars.sh
            bash research/upstream-runtime/arm11/build.sh \
              research/upstream-runtime/build/generated/teavm/c \
              research/upstream-runtime/build/probe-3ds-campaign-sector'
          test -s research/upstream-runtime/build/probe-3ds-campaign-sector/upstream-probe.3dsx

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: upstream-arm11-campaign-sector
          path: |
            research/upstream-runtime/build/probe-3ds-campaign-sector/upstream-probe.3dsx
            research/upstream-runtime/build/probe-3ds-campaign-sector/upstream-probe.elf
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: upstream-arm11-world-roundtrip
          path: |
            research/upstream-runtime/build/probe-3ds-world-roundtrip/upstream-probe.3dsx
            research/upstream-runtime/build/probe-3ds-world-roundtrip/upstream-probe.elf
          if-no-files-found: error

  audio-inventory:
    name: Audio asset inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Fetch pinned upstream asset tree
        run: |
          git clone --depth 1 --branch v160.8 \
            https://github.com/Anuken/Mindustry.git "$RUNNER_TEMP/Mindustry"
          test "$(git -C "$RUNNER_TEMP/Mindustry" rev-parse HEAD)" = \
            "19a0f40d44514f4802a8b79770456e7e32e34da0"

      - name: Run pinned audio inventory
        run: |
          java research/upstream-runtime/host/UpstreamAudioInventory.java \
            "$RUNNER_TEMP/Mindustry" | tee "$RUNNER_TEMP/audio.log"
          grep -F 'UPSTREAM_AUDIO kind=music files=16 bytes=28493699' "$RUNNER_TEMP/audio.log"
          grep -F 'UPSTREAM_AUDIO kind=sounds files=205 bytes=7093890' "$RUNNER_TEMP/audio.log"
          grep -F 'UPSTREAM_AUDIO total_files=221 total_bytes=35587589 manifest_sha256=f16c7f1c163d04b9843390146aafc2197cb6f6a3ad8db30e1872c7b1853be5fc' "$RUNNER_TEMP/audio.log"

  progression-baseline:
    name: Progression baseline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Fetch pinned official server JAR
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/Anuken/Mindustry/releases/download/v160.8/server-release.jar \
            -o "$RUNNER_TEMP/server-release.jar"

      - name: Run pinned sector/tech-tree baseline
        run: |
          java -cp "$RUNNER_TEMP/server-release.jar" \
            research/upstream-runtime/host/UpstreamProgressionBaseline.java \
            | tee "$RUNNER_TEMP/progression.log"
          grep -F 'UPSTREAM_PROGRESSION tech_nodes=375 tech_roots=2 sectors=95 manifest_sha256=4a61e8b260eb4f698ed128eb6654e2fa61f295f64d29b44c7638c7b8dda2bd4a' "$RUNNER_TEMP/progression.log"

      - name: Run pinned campaign and tech-tree persistence baseline
        run: |
          java -cp "$RUNNER_TEMP/server-release.jar" \
            research/upstream-runtime/host/UpstreamCampaignPersistenceBaseline.java \
            | tee "$RUNNER_TEMP/campaign-persistence.log"
          grep -F 'UPSTREAM_CAMPAIGN_INIT root=groundZero(id=170,unlocked=true) frozenForest(id=64,locked=true,objComplete=false)' "$RUNNER_TEMP/campaign-persistence.log"
          grep -F 'conveyorUnlocked=true junctionUnlocked=true routerLocked=true routerProgress=50/100 groundZeroCaptured=true frozenForestObjComplete=true' "$RUNNER_TEMP/campaign-persistence.log"
          grep -F 'UPSTREAM_CAMPAIGN_RESILIENCE waterMigrated=true resetOk=true backupRecovered=true corruptHandled=true' "$RUNNER_TEMP/campaign-persistence.log"
          grep -F 'UPSTREAM_CAMPAIGN_PASS tech_nodes=375 sectors=95' "$RUNNER_TEMP/campaign-persistence.log"

  combat-baseline:
    name: Combat metadata baseline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Fetch pinned official server JAR
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/Anuken/Mindustry/releases/download/v160.8/server-release.jar \
            -o "$RUNNER_TEMP/server-release.jar"

      - name: Run pinned unit/bullet baseline
        run: |
          java -cp "$RUNNER_TEMP/server-release.jar" \
            research/upstream-runtime/host/UpstreamCombatBaseline.java \
            | tee "$RUNNER_TEMP/combat.log"
          grep -F 'UPSTREAM_COMBAT units=69 bullets=202 manifest_sha256=e35013e20c50cbe83169794e898e281898c717f1f373e9b84796090470a76882' "$RUNNER_TEMP/combat.log"

  audio-conversion:
    name: Audio conversion
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Fetch pinned upstream asset tree
        run: |
          git clone --depth 1 --branch v160.8 \
            https://github.com/Anuken/Mindustry.git "$RUNNER_TEMP/Mindustry"
          test "$(git -C "$RUNNER_TEMP/Mindustry" rev-parse HEAD)" = \
            "19a0f40d44514f4802a8b79770456e7e32e34da0"

      - name: Ensure ffmpeg is available
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Convert pinned upstream audio
        run: |
          test -f "$RUNNER_TEMP/Mindustry/core/assets/sounds/ui/waveSpawn.ogg"
          python3 tools/build_audio_assets.py \
            --upstream "$RUNNER_TEMP/Mindustry" \
            --map audio/upstream-audio-map.json \
            --triggers audio/upstream-audio-triggers.json \
            --out "$RUNNER_TEMP/audio" \
            --romfs-out "$RUNNER_TEMP/romfs-audio" | tee "$RUNNER_TEMP/audio-convert.log"
          grep -F 'AUDIO_ASSETS files=9' "$RUNNER_TEMP/audio-convert.log"
          grep -F 'AUDIO_ROMFS files=9' "$RUNNER_TEMP/audio-convert.log"
          test -s "$RUNNER_TEMP/audio/ui.button.pcm"
          test -s "$RUNNER_TEMP/audio/wave.spawn.pcm"
          test -s "$RUNNER_TEMP/audio/shoot.duo.pcm"
          test -s "$RUNNER_TEMP/audio/enemy.kill.pcm"
          test -s "$RUNNER_TEMP/audio/conveyor.loop.pcm"
          test -s "$RUNNER_TEMP/audio/drill.loop.pcm"
          test -s "$RUNNER_TEMP/audio/block.place.pcm"
          test -s "$RUNNER_TEMP/audio/block.break.pcm"
          test -s "$RUNNER_TEMP/audio/audio-manifest.json"
          test -s "$RUNNER_TEMP/romfs-audio/audio/ui.button.pcm"
          test -s "$RUNNER_TEMP/romfs-audio/audio/ui.unlock.pcm"
          test -s "$RUNNER_TEMP/romfs-audio/audio/wave.spawn.pcm"
          test -s "$RUNNER_TEMP/romfs-audio/audio/shoot.duo.pcm"
          test -s "$RUNNER_TEMP/romfs-audio/audio/enemy.kill.pcm"
          test -s "$RUNNER_TEMP/romfs-audio/audio/conveyor.loop.pcm"
          test -s "$RUNNER_TEMP/romfs-audio/audio/drill.loop.pcm"
          test -s "$RUNNER_TEMP/romfs-audio/audio/block.place.pcm"
          test -s "$RUNNER_TEMP/romfs-audio/audio/block.break.pcm"
          test -s "$RUNNER_TEMP/romfs-audio/audio-index.h"
          test ! -e "$RUNNER_TEMP/romfs-audio/ui.button.pcm"
          cat > "$RUNNER_TEMP/romfs-audio/index_check.c" <<'EOF'
          #include "audio-index.h"
          int main(void) { return M3DS_AUDIO_CLIP_COUNT == 9U ? 0 : 1; }
          EOF
          cc -std=c11 -Wall -Wextra -Werror -Iinclude -I"$RUNNER_TEMP/romfs-audio" \
            "$RUNNER_TEMP/romfs-audio/index_check.c" \
            -o "$RUNNER_TEMP/romfs-audio/index_check"
          "$RUNNER_TEMP/romfs-audio/index_check"

  net-session-baseline:
    name: Net session baseline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Fetch pinned official server JAR
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/Anuken/Mindustry/releases/download/v160.8/server-release.jar \
            -o "$RUNNER_TEMP/server-release.jar"
          echo "faeaf247a8b622de940181a96cb21cb20692d3c3da4e8ac3f79cb4af5059aa6c  $RUNNER_TEMP/server-release.jar" | sha256sum -c -

      - name: Run live v160.8 handshake, session, and LZ4 cross-check
        run: |
          python3 tools/verify_upstream_net.py \
            --server-jar "$RUNNER_TEMP/server-release.jar" \
            | tee "$RUNNER_TEMP/net-session.log"
          grep -F 'UPSTREAM_NET_PASS sessions=2 mismatch=clientOutdated' "$RUNNER_TEMP/net-session.log"
          grep -F 'DECODE_PKT_OK ' "$RUNNER_TEMP/net-session.log"
          grep -F 'compression=1 ' "$RUNNER_TEMP/net-session.log"

  production-baseline:
    name: Production, power, and liquid baseline
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Fetch pinned upstream source, map, server JAR, and Arc
        run: |
          git clone --depth 1 --branch v160.8 \
            https://github.com/Anuken/Mindustry.git "$RUNNER_TEMP/Mindustry"
          test "$(git -C "$RUNNER_TEMP/Mindustry" rev-parse HEAD)" = \
            "19a0f40d44514f4802a8b79770456e7e32e34da0"
          git -C "$RUNNER_TEMP/Mindustry" show \
            HEAD:core/assets/maps/default/glacier.msav > "$RUNNER_TEMP/glacier.msav"
          curl --fail --silent --show-error --location \
            https://github.com/Anuken/Mindustry/releases/download/v160.8/server-release.jar \
            -o "$RUNNER_TEMP/server-release.jar"
          echo "faeaf247a8b622de940181a96cb21cb20692d3c3da4e8ac3f79cb4af5059aa6c  $RUNNER_TEMP/server-release.jar" | sha256sum -c -
          git clone --filter=blob:none --no-checkout \
            https://github.com/Anuken/Arc.git "$RUNNER_TEMP/Arc"
          git -C "$RUNNER_TEMP/Arc" fetch --depth 1 origin \
            7445105cd2683daf5b9ac7033ebb07265d3e814d
          git -C "$RUNNER_TEMP/Arc" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/Arc" rev-parse HEAD)" = \
            "7445105cd2683daf5b9ac7033ebb07265d3e814d"

      - name: Run pinned production, power, and liquid baseline
        run: |
          java -cp "$RUNNER_TEMP/server-release.jar" \
            research/upstream-runtime/host/UpstreamProductionBaseline.java \
            | tee "$RUNNER_TEMP/production.log"
          grep -Fx 'UPSTREAM_PRODUCTION_CATALOG blocks=12 manifest_sha256=29d41b2000392e726c81fae375b0acf903b68c987bb0e4955e15646712da0996' "$RUNNER_TEMP/production.log"
          grep -Fx 'UPSTREAM_PRODUCTION_STARVED ticks=60 waterMilli=4641 pods=0 graphite=0' "$RUNNER_TEMP/production.log"
          grep -Fx 'UPSTREAM_PRODUCTION_DISCONNECT graphiteTick=90 first=199 paused=60 pods=1' "$RUNNER_TEMP/production.log"
          grep -Fx 'UPSTREAM_PRODUCTION_FULL filled=2254 held=120 pods=10 waterCapOk=true' "$RUNNER_TEMP/production.log"
          grep -Fx 'UPSTREAM_PRODUCTION_ORDER runs=2 ticks=2693 trace_hash=0x596d5082ce819d54' "$RUNNER_TEMP/production.log"

      - name: Run production-ticks JVM probe and generate TeaVM C
        shell: bash
        run: |
          set -o pipefail
          bash "$RUNNER_TEMP/Mindustry/gradlew" -p research/upstream-runtime \
            --no-daemon --console=plain \
            "-PupstreamCheckout=$RUNNER_TEMP/Mindustry" \
            "-PreferenceJar=$RUNNER_TEMP/server-release.jar" \
            "-ParcCheckout=$RUNNER_TEMP/Arc" \
            -Pprobe=production-ticks \
            runProbeJvm "--args=$RUNNER_TEMP/glacier.msav" generateC | tee "$RUNNER_TEMP/production-probe-jvm.log"
          grep -Fx 'UPSTREAM_PRODUCTION_STARVED ticks=60 waterMilli=4641 pods=0' "$RUNNER_TEMP/production-probe-jvm.log"
          grep -Fx 'UPSTREAM_PRODUCTION_DISCONNECT first=199 paused=60 pods=1' "$RUNNER_TEMP/production-probe-jvm.log"
          grep -Fx 'UPSTREAM_PRODUCTION_FULL filled=2254 held=120 pods=10' "$RUNNER_TEMP/production-probe-jvm.log"

      - name: Verify generated TeaVM C at -O0 and -O2 against JVM trace
        run: |
          rm -rf "$RUNNER_TEMP/teavm-c-host"
          cp -R research/upstream-runtime/build/generated/teavm/c "$RUNNER_TEMP/teavm-c-host"
          python3 research/upstream-runtime/arm11/fix_reflection_lifetime.py "$RUNNER_TEMP/teavm-c-host"
          cc -std=gnu11 -O0 -fwrapv "$RUNNER_TEMP/teavm-c-host/all.c" -lm -lpthread \
            -o "$RUNNER_TEMP/teavm-c-host/probe_o0"
          cc -std=gnu11 -O2 -fwrapv "$RUNNER_TEMP/teavm-c-host/all.c" -lm -lpthread \
            -o "$RUNNER_TEMP/teavm-c-host/probe_o2"
          "$RUNNER_TEMP/teavm-c-host/probe_o0" "$RUNNER_TEMP/glacier.msav" | tee "$RUNNER_TEMP/production-o0.log"
          "$RUNNER_TEMP/teavm-c-host/probe_o2" "$RUNNER_TEMP/glacier.msav" | tee "$RUNNER_TEMP/production-o2.log"
          for log in "$RUNNER_TEMP/production-o0.log" "$RUNNER_TEMP/production-o2.log"; do
            grep -Fx 'UPSTREAM_PRODUCTION_STARVED ticks=60 waterMilli=4641 pods=0' "$log"
            grep -Fx 'UPSTREAM_PRODUCTION_DISCONNECT first=199 paused=60 pods=1' "$log"
            grep -Fx 'UPSTREAM_PRODUCTION_FULL filled=2254 held=120 pods=10' "$log"
          done

      - name: Build ARM11 production-ticks probe with pinned devkitARM image
        run: |
          image=devkitpro/devkitarm@sha256:116afba8df8453961de2936ffab20dd441edf4d682856c1ec8b0e53d7ed0bbf5
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/work" -w /work "$image" bash -lc '
            source /opt/devkitpro/3dsvars.sh
            bash research/upstream-runtime/arm11/build.sh \
              research/upstream-runtime/build/generated/teavm/c \
              research/upstream-runtime/build/probe-3ds-production'
          test -s research/upstream-runtime/build/probe-3ds-production/upstream-probe.3dsx
          test -s research/upstream-runtime/build/probe-3ds-production/upstream-probe.elf
