      - name: Fetch pinned official server JAR
        run: bash .github/scripts/fetch_upstream_v160.sh --server-jar

      - name: Run live v160.8 handshake, session, and LZ4 cross-check
        run: |
          python3 tools/verify_upstream_net.py \
            --server-jar "$RUNNER_TEMP/server-release.jar" \
