name: Upstream ARM11 smoke

on:
  pull_request:
    branches: [main]
    paths:
      - "research/upstream-runtime/**"
      - "audio/**"
      - "tools/build_audio_assets.py"
      - "tools/stage_music_assets.py"
      - "tools/verify_upstream_net.py"
      - "tools/verify_upstream_live_net.py"
      - "tests/tools/test_audio_assets.py"
      - "tests/tools/test_stage_music_assets.py"
      - "src/net/mindustry_net.c"
      - "include/net/**"
      - "tests/net/**"
      - ".github/scripts/fetch_upstream_v160.sh"
      - ".github/scripts/smoke_scope.py"
      - ".github/workflows/upstream-arm11-smoke.yml"
  push:
    branches: [main]
    paths:
      - "research/upstream-runtime/**"
      - "audio/**"
      - "tools/build_audio_assets.py"
      - "tools/stage_music_assets.py"
      - "tools/verify_upstream_net.py"
      - "tools/verify_upstream_live_net.py"
      - "tests/tools/test_audio_assets.py"
      - "tests/tools/test_stage_music_assets.py"
      - "src/net/mindustry_net.c"
      - "include/net/**"
      - "tests/net/**"
      - ".github/scripts/fetch_upstream_v160.sh"
      - ".github/scripts/smoke_scope.py"
      - ".github/workflows/upstream-arm11-smoke.yml"
  workflow_dispatch:

concurrency:
  group: upstream-arm11-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Scope smoke checks
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.head.repo.fork)) && '["self-hosted", "linux", "x64", "min3dstry-fast"]' || '"ubuntu-latest"') }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run_all: ${{ steps.scope.outputs.run_all }}
      run_probes: ${{ steps.scope.outputs.run_probes }}
      probes_json: ${{ steps.scope.outputs.probes_json }}
      run_save: ${{ steps.scope.outputs.run_save }}
      run_audio: ${{ steps.scope.outputs.run_audio }}
      run_progression: ${{ steps.scope.outputs.run_progression }}
      run_combat: ${{ steps.scope.outputs.run_combat }}
      run_net: ${{ steps.scope.outputs.run_net }}
      run_production: ${{ steps.scope.outputs.run_production }}
      run_factory: ${{ steps.scope.outputs.run_factory }}
      run_singleplayer: ${{ steps.scope.outputs.run_singleplayer }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: scope
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/smoke_scope.py

  probe:
    name: Probe ${{ matrix.probe }}
    needs: [changes]
    if: needs.changes.outputs.run_probes == 'true'
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.head.repo.fork)) && '["self-hosted", "linux", "x64", "min3dstry"]' || '"ubuntu-latest"') }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        probe: ${{ fromJSON(needs.changes.outputs.probes_json) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/cache@v4
        if: runner.environment == 'github-hosted'
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-v1-${{ hashFiles('research/upstream-runtime/build.gradle', 'research/upstream-runtime/gradle/**') }}

      - name: Fetch pinned upstream v160.8 source, server JAR, and Arc
        run: |
          args=(--mindustry --server-jar)
          if [ "${{ matrix.probe }}" = "resource" ] || [ "${{ matrix.probe }}" = "executor" ] || [ "${{ matrix.probe }}" = "campaign-settings" ] || [ "${{ matrix.probe }}" = "campaign-content" ] || [ "${{ matrix.probe }}" = "campaign-research" ] || [ "${{ matrix.probe }}" = "campaign-slot-meta" ] || [ "${{ matrix.probe }}" = "campaign-sector-info" ] || [ "${{ matrix.probe }}" = "campaign-planet" ] || [ "${{ matrix.probe }}" = "campaign-sector-state" ] || [ "${{ matrix.probe }}" = "campaign-launch" ] || [ "${{ matrix.probe }}" = "campaign-capture" ] || [ "${{ matrix.probe }}" = "campaign-saves" ] || [ "${{ matrix.probe }}" = "campaign-slot-discovery" ] || [ "${{ matrix.probe }}" = "wave-routing" ]; then
            args+=(--arc)
          fi
          if [ "${{ matrix.probe }}" = "wave-routing" ] || [ "${{ matrix.probe }}" = "campaign-slot-meta" ] || [ "${{ matrix.probe }}" = "campaign-launch" ] || [ "${{ matrix.probe }}" = "campaign-capture" ] || [ "${{ matrix.probe }}" = "campaign-slot-discovery" ]; then
            args+=(--glacier)
          fi
          bash .github/scripts/fetch_upstream_v160.sh "${args[@]}"

      - name: Run JVM reference and generate TeaVM C
        shell: bash
        run: |
          set -o pipefail
          extra=()
          if [ "${{ matrix.probe }}" = "resource" ] || [ "${{ matrix.probe }}" = "executor" ] || [ "${{ matrix.probe }}" = "campaign-settings" ] || [ "${{ matrix.probe }}" = "campaign-content" ] || [ "${{ matrix.probe }}" = "campaign-research" ] || [ "${{ matrix.probe }}" = "campaign-slot-meta" ] || [ "${{ matrix.probe }}" = "campaign-sector-info" ] || [ "${{ matrix.probe }}" = "campaign-planet" ] || [ "${{ matrix.probe }}" = "campaign-sector-state" ] || [ "${{ matrix.probe }}" = "campaign-launch" ] || [ "${{ matrix.probe }}" = "campaign-capture" ] || [ "${{ matrix.probe }}" = "campaign-saves" ] || [ "${{ matrix.probe }}" = "campaign-slot-discovery" ] || [ "${{ matrix.probe }}" = "wave-routing" ]; then
            extra=("-ParcCheckout=$RUNNER_TEMP/Arc")
          fi
          probe_args=()
          if [ "${{ matrix.probe }}" = "wave-routing" ]; then
            probe_args=("-PprobeArgs=$RUNNER_TEMP/glacier.msav")
          elif [ "${{ matrix.probe }}" = "campaign-slot-meta" ] || [ "${{ matrix.probe }}" = "campaign-launch" ]; then
            probe_args=("-PprobeArgs=$RUNNER_TEMP/glacier.msav $RUNNER_TEMP/sector-serpulo-15.msav")
          elif [ "${{ matrix.probe }}" = "campaign-capture" ]; then
            probe_args=("-PprobeArgs=$RUNNER_TEMP/glacier.msav")
          elif [ "${{ matrix.probe }}" = "campaign-slot-discovery" ]; then
            probe_args=("-PprobeArgs=$RUNNER_TEMP/slot-discovery-base $RUNNER_TEMP/glacier.msav")
          fi
          bash "$RUNNER_TEMP/Mindustry/gradlew" -p research/upstream-runtime \
            --no-daemon --console=plain \
            "-PupstreamCheckout=$RUNNER_TEMP/Mindustry" \
            "-PreferenceJar=$RUNNER_TEMP/server-release.jar" \
            -Pprobe=${{ matrix.probe }} \
            "${extra[@]}" \
            "${probe_args[@]}" \
            runProbeJvm generateC | tee "$RUNNER_TEMP/probe.log"
          if [ "${{ matrix.probe }}" = "resource" ]; then
            grep -F 'UPSTREAM_RESOURCE size=709 crc32=3921318438 classpath=ok internal=ok missing=ok' \
              "$RUNNER_TEMP/probe.log"
          fi
          if [ "${{ matrix.probe }}" = "executor" ]; then
            grep -Fx 'UPSTREAM_EXECUTOR_POOLS bounded=ok unbounded=ok' "$RUNNER_TEMP/probe.log"
            grep -Fx 'UPSTREAM_EXECUTOR_MONITOR_GC object=ok array=ok' "$RUNNER_TEMP/probe.log"
          fi
          if [ "${{ matrix.probe }}" = "campaign-settings" ]; then
            grep -F 'campaign=unlocked:conveyor,research:50 reload=ok' "$RUNNER_TEMP/probe.log"
          fi
          if [ "${{ matrix.probe }}" = "campaign-content" ]; then
            grep -F 'lockedBefore=ok conveyorUnlocked=true key=conveyor-unlocked research=50 reload=ok' "$RUNNER_TEMP/probe.log"
          fi
          if [ "${{ matrix.probe }}" = "campaign-research" ]; then
            grep -F 'UPSTREAM_CAMPAIGN_RESEARCH path=tmp root=serpulo node=conveyor copper=50 lockedBefore=ok reload=ok' "$RUNNER_TEMP/probe.log"
          fi
          if [ "${{ matrix.probe }}" = "campaign-slot-meta" ]; then
            grep -F 'UPSTREAM_CAMPAIGN_SLOT_META slot=sector-serpulo-15.msav' "$RUNNER_TEMP/probe.log"
            grep -F 'version=13 preset=groundZero wave=1 size=150x250 meta=ok' "$RUNNER_TEMP/probe.log"
          fi
          if [ "${{ matrix.probe }}" = "campaign-sector-info" ]; then
            grep -F 'UPSTREAM_CAMPAIGN_SECTOR_INFO path=tmp key=serpulo-s-170-info api=ok captured=ok wave=7 items=250:75 core=coreShard resource=copper-wall reload=ok clear=ok' "$RUNNER_TEMP/probe.log"
          fi
          if [ "${{ matrix.probe }}" = "campaign-planet" ]; then
            grep -F 'UPSTREAM_CAMPAIGN_PLANET path=tmp planet=serpulo sector=86 preset=frozenForest lastSector=86 reload=ok' "$RUNNER_TEMP/probe.log"
          fi
          if [ "${{ matrix.probe }}" = "campaign-sector-state" ]; then
            grep -F 'UPSTREAM_CAMPAIGN_SECTOR_STATE sector=15 groundZero=ok played=ok captured=ok waves=locked gameOver=ok menu=ok' "$RUNNER_TEMP/probe.log"
          fi
          if [ "${{ matrix.probe }}" = "campaign-launch" ]; then
            grep -F 'UPSTREAM_CAMPAIGN_LAUNCH slot=sector-serpulo-15.msav' "$RUNNER_TEMP/probe.log"
            grep -F 'version=13 sector=15 wave=5 world=150x250 launch=ok' "$RUNNER_TEMP/probe.log"
          fi
          if [ "${{ matrix.probe }}" = "campaign-capture" ]; then
            grep -F 'UPSTREAM_CAMPAIGN_CAPTURE sector=15 captured=ok waves=off attack=off event=ok persisted=ok' "$RUNNER_TEMP/probe.log"
          fi
          if [ "${{ matrix.probe }}" = "campaign-saves" ]; then
            grep -F 'UPSTREAM_CAMPAIGN_SAVES path=tmp sector=sector-serpulo-15.msav' "$RUNNER_TEMP/probe.log"
            grep -F 'extension=msav saves=ok' "$RUNNER_TEMP/probe.log"
          fi
          if [ "${{ matrix.probe }}" = "campaign-slot-discovery" ]; then
            grep -F 'UPSTREAM_CAMPAIGN_SLOT_DISCOVERY path=tmp slots=1 file=sector-serpulo-15.msav' "$RUNNER_TEMP/probe.log"
            grep -F 'discovery=ok' "$RUNNER_TEMP/probe.log"
          fi
          if [ "${{ matrix.probe }}" = "wave-routing" ]; then
            grep -F 'UPSTREAM_WAVE_SETUP core=81,26 enemyCore=81,224 groundSpawns=1 fieldHash=629058db4926d64e' \
              "$RUNNER_TEMP/probe.log"
            grep -F 'UPSTREAM_WAVE wave=1 spawned=dagger=1 groundSpawned=1 first=79,218->80,172 distance=1533->1165 min=1165 alive=1/1 ammo=30 nextWave=2' \
              "$RUNNER_TEMP/probe.log"
            grep -F 'UPSTREAM_WAVE wave=2 spawned=dagger=1,gamma=2 groundSpawned=1 first=82,217->80,171 distance=1524->1159 min=1159 alive=1/1 ammo=30 nextWave=3' \
              "$RUNNER_TEMP/probe.log"
            grep -F 'UPSTREAM_WAVE wave=3 spawned=dagger=2 groundSpawned=2 first=79,219->80,173 distance=1545->1177 min=1177 alive=2/2 ammo=30 nextWave=4' \
              "$RUNNER_TEMP/probe.log"
            grep -F 'UPSTREAM_WAVE wave=4 spawned=dagger=2 groundSpawned=2 first=79,219->80,173 distance=1546->1177 min=1177 alive=2/2 ammo=29 nextWave=5' \
              "$RUNNER_TEMP/probe.log"
          fi

      - name: Verify executor monitor handoffs across garbage collection
        if: matrix.probe == 'executor'
        shell: bash
        run: |
          set -o pipefail
          cp -R research/upstream-runtime/build/generated/teavm/c "$RUNNER_TEMP/teavm-c-executor"
          python3 research/upstream-runtime/arm11/fix_gc_monitors.py "$RUNNER_TEMP/teavm-c-executor"
          cc -std=gnu11 -O2 -fwrapv "$RUNNER_TEMP/teavm-c-executor/all.c" -lm -lpthread \
            -o "$RUNNER_TEMP/teavm-c-executor/probe"
          timeout 30s "$RUNNER_TEMP/teavm-c-executor/probe" | tee "$RUNNER_TEMP/executor-c.log"
          grep -Fx 'UPSTREAM_EXECUTOR_MONITOR_GC object=ok array=ok' "$RUNNER_TEMP/executor-c.log"

      - name: Verify wave-routing TeaVM C at -O0 and -O2 against JVM trace
        if: matrix.probe == 'wave-routing'
        shell: bash
        run: |
          set -o pipefail
          rm -rf "$RUNNER_TEMP/teavm-c-wave"
          cp -R research/upstream-runtime/build/generated/teavm/c "$RUNNER_TEMP/teavm-c-wave"
          python3 research/upstream-runtime/arm11/fix_reflection_lifetime.py "$RUNNER_TEMP/teavm-c-wave"
          python3 research/upstream-runtime/arm11/fix_gc_monitors.py "$RUNNER_TEMP/teavm-c-wave"
          cc -std=gnu11 -O0 -fwrapv -ffp-contract=off "$RUNNER_TEMP/teavm-c-wave/all.c" -lm -lpthread \
            -o "$RUNNER_TEMP/teavm-c-wave/probe_o0"
          cc -std=gnu11 -O2 -fwrapv -ffp-contract=off "$RUNNER_TEMP/teavm-c-wave/all.c" -lm -lpthread \
            -o "$RUNNER_TEMP/teavm-c-wave/probe_o2"
          "$RUNNER_TEMP/teavm-c-wave/probe_o0" "$RUNNER_TEMP/glacier.msav" | tee "$RUNNER_TEMP/wave-o0.log"
          "$RUNNER_TEMP/teavm-c-wave/probe_o2" "$RUNNER_TEMP/glacier.msav" | tee "$RUNNER_TEMP/wave-o2.log"
          for log in "$RUNNER_TEMP/wave-o0.log" "$RUNNER_TEMP/wave-o2.log"; do
            grep -Fx 'UPSTREAM_WORLD_FINGERPRINT 2e7b9f883994de6c' "$log"
            grep -Fx 'UPSTREAM_WAVE_SETUP core=81,26 enemyCore=81,224 groundSpawns=1 fieldHash=629058db4926d64e' "$log"
            grep -Fx 'UPSTREAM_WAVE wave=1 spawned=dagger=1 groundSpawned=1 first=79,218->80,172 distance=1533->1165 min=1165 alive=1/1 ammo=30 nextWave=2' "$log"
            grep -Fx 'UPSTREAM_WAVE wave=2 spawned=dagger=1,gamma=2 groundSpawned=1 first=82,217->80,171 distance=1524->1159 min=1159 alive=1/1 ammo=30 nextWave=3' "$log"
            grep -Fx 'UPSTREAM_WAVE wave=3 spawned=dagger=2 groundSpawned=2 first=79,219->80,173 distance=1545->1177 min=1177 alive=2/2 ammo=30 nextWave=4' "$log"
            grep -Fx 'UPSTREAM_WAVE wave=4 spawned=dagger=2 groundSpawned=2 first=79,219->80,173 distance=1546->1177 min=1177 alive=2/2 ammo=29 nextWave=5' "$log"
          done

      - name: Build ARM11 probe with pinned devkitARM image
        env:
          M3DS_RELAX_POINTER_TYPES: ${{ (matrix.probe == 'campaign-slot-discovery' || matrix.probe == 'campaign-capture') && '1' || '0' }}
        run: |
          image=devkitpro/devkitarm@sha256:116afba8df8453961de2936ffab20dd441edf4d682856c1ec8b0e53d7ed0bbf5
          docker_numa_args=()
          if [ -n "${M3DS_DOCKER_CPUSET_CPUS:-}" ]; then
            docker_numa_args+=(--cpuset-cpus "$M3DS_DOCKER_CPUSET_CPUS")
          fi
          if [ -n "${M3DS_DOCKER_CPUSET_MEMS:-}" ]; then
            docker_numa_args+=(--cpuset-mems "$M3DS_DOCKER_CPUSET_MEMS")
          fi
          docker run --rm "${docker_numa_args[@]}" -e M3DS_RELAX_POINTER_TYPES -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/work" -w /work "$image" bash -lc '
            source /opt/devkitpro/3dsvars.sh
            bash research/upstream-runtime/arm11/build.sh \
              research/upstream-runtime/build/generated/teavm/c \
              research/upstream-runtime/build/probe-3ds'
          test -s research/upstream-runtime/build/probe-3ds/upstream-probe.3dsx
          test -s research/upstream-runtime/build/probe-3ds/upstream-probe.elf

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: upstream-arm11-${{ matrix.probe }}
          path: |
            research/upstream-runtime/build/probe-3ds/upstream-probe.3dsx
            research/upstream-runtime/build/probe-3ds/upstream-probe.elf
          if-no-files-found: error

  save-baseline:
    name: Save writer baseline
    needs: [changes]
    if: needs.changes.outputs.run_save == 'true'
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.head.repo.fork)) && '["self-hosted", "linux", "x64", "min3dstry"]' || '"ubuntu-latest"') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Fetch pinned upstream map and server JAR
        run: bash .github/scripts/fetch_upstream_v160.sh --glacier --server-jar

      - name: Run upstream SaveIO writer baseline
        run: |
          java -cp "$RUNNER_TEMP/server-release.jar" \
            research/upstream-runtime/host/UpstreamSaveBaseline.java \
            "$RUNNER_TEMP/glacier.msav" | tee "$RUNNER_TEMP/save.log"
          grep -F 'UPSTREAM_SAVE header=MSAV version=13' "$RUNNER_TEMP/save.log"

      - name: Compile save resilience probe
        run: |
          mkdir -p "$RUNNER_TEMP/save-resilience"
          javac -cp "$RUNNER_TEMP/server-release.jar" \
            -d "$RUNNER_TEMP/save-resilience" \
            research/upstream-runtime/host/UpstreamSaveResilienceProbe.java

      - name: Run save resilience checks
        run: |
          java -cp "$RUNNER_TEMP/server-release.jar:$RUNNER_TEMP/save-resilience" \
            UpstreamSaveResilienceProbe "$RUNNER_TEMP/glacier.msav" \
            | tee "$RUNNER_TEMP/save-resilience.log"
          grep -F 'UPSTREAM_SAVE_RESILIENCE_PASS' "$RUNNER_TEMP/save-resilience.log"
          for record in valid=ok truncated=rejected bad_header=rejected \
              unknown_version=rejected backup=recovered; do
            grep -F "UPSTREAM_SAVE_RESILIENCE $record" "$RUNNER_TEMP/save-resilience.log"
          done
          grep -F 'MIN3DSTRY_SAVE_POLICY existing=protected' "$RUNNER_TEMP/save-resilience.log"
          grep -F 'MIN3DSTRY_SAVE_POLICY interrupted=rejected' "$RUNNER_TEMP/save-resilience.log"

  world-roundtrip:
    name: World save round trip
    needs: [changes]
    if: needs.changes.outputs.run_save == 'true'
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.head.repo.fork)) && '["self-hosted", "linux", "x64", "min3dstry"]' || '"ubuntu-latest"') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/cache@v4
        if: runner.environment == 'github-hosted'
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-v1-${{ hashFiles('research/upstream-runtime/build.gradle', 'research/upstream-runtime/gradle/**') }}

      - name: Fetch pinned upstream source, map, server JAR and Arc
        run: bash .github/scripts/fetch_upstream_v160.sh --glacier --server-jar --arc

      - name: Generate v13 fixture and run JVM round trip
        shell: bash
        run: |
          set -o pipefail
          map="$RUNNER_TEMP/glacier.msav"
          v13="$RUNNER_TEMP/glacier-v13.msav"
          out="$RUNNER_TEMP/glacier-roundtrip.msav"
          bash "$RUNNER_TEMP/Mindustry/gradlew" -p research/upstream-runtime \
            --no-daemon --console=plain \
            "-PupstreamCheckout=$RUNNER_TEMP/Mindustry" \
            "-PreferenceJar=$RUNNER_TEMP/server-release.jar" \
            "-ParcCheckout=$RUNNER_TEMP/Arc" \
            -Pprobe=world-roundtrip \
            makeWorldSaveFixture "--args=$map $v13"
          bash "$RUNNER_TEMP/Mindustry/gradlew" -p research/upstream-runtime \
            --no-daemon --console=plain \
            "-PupstreamCheckout=$RUNNER_TEMP/Mindustry" \
            "-PreferenceJar=$RUNNER_TEMP/server-release.jar" \
            "-ParcCheckout=$RUNNER_TEMP/Arc" \
            -Pprobe=world-roundtrip \
            runProbeJvm "--args=$map $v13 $out" | tee "$RUNNER_TEMP/roundtrip.log"
          grep -F 'UPSTREAM_SAVE_ROUNDTRIP version=13 marker=ok' "$RUNNER_TEMP/roundtrip.log"

      - name: Run upstream save decoder parity baseline
        shell: bash
        run: |
          set -o pipefail
          v13="$RUNNER_TEMP/glacier-v13.msav"
          bash "$RUNNER_TEMP/Mindustry/gradlew" -p research/upstream-runtime \
            --no-daemon --console=plain \
            "-PupstreamCheckout=$RUNNER_TEMP/Mindustry" \
            "-PreferenceJar=$RUNNER_TEMP/server-release.jar" \
            "-ParcCheckout=$RUNNER_TEMP/Arc" \
            -Pprobe=save-decode \
            runProbeJvm "-PprobeArgs=$v13" | tee "$RUNNER_TEMP/save-decode.log"
          grep -F 'UPSTREAM_SAVE_STATE buildings=2 hash=3a375fd4f81c5680' \
            "$RUNNER_TEMP/save-decode.log"

      - name: Run sector slot JVM round trip
        shell: bash
        run: |
          set -o pipefail
          map="$RUNNER_TEMP/glacier.msav"
          v13="$RUNNER_TEMP/glacier-v13.msav"
          slot="$RUNNER_TEMP/sector-serpulo-170.msav"
          bash "$RUNNER_TEMP/Mindustry/gradlew" -p research/upstream-runtime \
            --no-daemon --console=plain \
            "-PupstreamCheckout=$RUNNER_TEMP/Mindustry" \
            "-PreferenceJar=$RUNNER_TEMP/server-release.jar" \
            "-ParcCheckout=$RUNNER_TEMP/Arc" \
            -Pprobe=campaign-sector \
            runProbeJvm "--args=$map $v13 $slot" | tee "$RUNNER_TEMP/sector.log"
          grep -F 'UPSTREAM_CAMPAIGN_SECTOR slot=sector-serpulo-170.msav' "$RUNNER_TEMP/sector.log"
          grep -F 'version=13 marker=ok' "$RUNNER_TEMP/sector.log"

      - name: Generate and build the ARM11 round-trip probe
        run: |
          bash "$RUNNER_TEMP/Mindustry/gradlew" -p research/upstream-runtime \
            --no-daemon --console=plain \
            "-Dorg.gradle.jvmargs=-Xmx3g" \
            "-PupstreamCheckout=$RUNNER_TEMP/Mindustry" \
            "-PreferenceJar=$RUNNER_TEMP/server-release.jar" \
            "-ParcCheckout=$RUNNER_TEMP/Arc" \
            -Pprobe=world-roundtrip generateC
          image=devkitpro/devkitarm@sha256:116afba8df8453961de2936ffab20dd441edf4d682856c1ec8b0e53d7ed0bbf5
          docker_numa_args=()
          if [ -n "${M3DS_DOCKER_CPUSET_CPUS:-}" ]; then
            docker_numa_args+=(--cpuset-cpus "$M3DS_DOCKER_CPUSET_CPUS")
          fi
          if [ -n "${M3DS_DOCKER_CPUSET_MEMS:-}" ]; then
            docker_numa_args+=(--cpuset-mems "$M3DS_DOCKER_CPUSET_MEMS")
          fi
          docker run --rm "${docker_numa_args[@]}" -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/work" -w /work "$image" bash -lc '
            source /opt/devkitpro/3dsvars.sh
            bash research/upstream-runtime/arm11/build.sh \
              research/upstream-runtime/build/generated/teavm/c \
              research/upstream-runtime/build/probe-3ds-world-roundtrip'
          test -s research/upstream-runtime/build/probe-3ds-world-roundtrip/upstream-probe.3dsx

      - name: Generate and build the ARM11 save-rows probe
        run: |
          bash "$RUNNER_TEMP/Mindustry/gradlew" -p research/upstream-runtime \
            --no-daemon --console=plain \
            "-Dorg.gradle.jvmargs=-Xmx3g" \
            "-PupstreamCheckout=$RUNNER_TEMP/Mindustry" \
            "-PreferenceJar=$RUNNER_TEMP/server-release.jar" \
            "-ParcCheckout=$RUNNER_TEMP/Arc" \
            -Pprobe=save-rows generateC
          image=devkitpro/devkitarm@sha256:116afba8df8453961de2936ffab20dd441edf4d682856c1ec8b0e53d7ed0bbf5
          docker_numa_args=()
          if [ -n "${M3DS_DOCKER_CPUSET_CPUS:-}" ]; then
            docker_numa_args+=(--cpuset-cpus "$M3DS_DOCKER_CPUSET_CPUS")
          fi
          if [ -n "${M3DS_DOCKER_CPUSET_MEMS:-}" ]; then
            docker_numa_args+=(--cpuset-mems "$M3DS_DOCKER_CPUSET_MEMS")
          fi
          docker run --rm "${docker_numa_args[@]}" -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/work" -w /work "$image" bash -lc '
            source /opt/devkitpro/3dsvars.sh
            bash research/upstream-runtime/arm11/build.sh \
              research/upstream-runtime/build/generated/teavm/c \
              research/upstream-runtime/build/probe-3ds-save-rows --save-rows'
          test -s research/upstream-runtime/build/probe-3ds-save-rows/upstream-probe.3dsx

      - name: Build the embedded TeaVM loader smoke
        run: |
          image=devkitpro/devkitarm@sha256:116afba8df8453961de2936ffab20dd441edf4d682856c1ec8b0e53d7ed0bbf5
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/work" -w /work "$image" bash -lc '
            source /opt/devkitpro/3dsvars.sh
            bash tools/build_teavm_loader.sh \
              research/upstream-runtime/build/generated/teavm/c build/teavm-loader
            arm-none-eabi-gcc -std=gnu11 -g -Os -fwrapv -D__3DS__ \
              -mword-relocations -march=armv6k -mtune=mpcore -mfpu=vfp \
              -mfloat-abi=hard -mtp=soft -Iinclude \
              -I"$DEVKITPRO/libctru/include" -L"$DEVKITPRO/libctru/lib" \
              -Lbuild/teavm-loader -specs=3dsx.specs \
              tests/platform/embed_loader_smoke.c src/platform/world_rows.c \
              src/platform/msav_world.c -lm3dsloader -lctru -lm \
              -o build/embed-loader-smoke.elf
            arm-none-eabi-gcc -std=gnu11 -g -Os -fwrapv -D__3DS__ \
              -DM3DS_SMOKE_MISSING -mword-relocations -march=armv6k \
              -mtune=mpcore -mfpu=vfp -mfloat-abi=hard -mtp=soft -Iinclude \
              -I"$DEVKITPRO/libctru/include" -L"$DEVKITPRO/libctru/lib" \
              -Lbuild/teavm-loader -specs=3dsx.specs \
              tests/platform/embed_loader_smoke.c src/platform/world_rows.c \
              src/platform/msav_world.c -lm3dsloader -lctru -lm \
              -o build/embed-loader-missing.elf
            test -s build/embed-loader-smoke.elf
            test -s build/embed-loader-missing.elf
          '

      - name: Link the app with the embedded loader
        run: |
          image=devkitpro/devkitarm@sha256:116afba8df8453961de2936ffab20dd441edf4d682856c1ec8b0e53d7ed0bbf5
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/work" -w /work "$image" bash -lc '
            source /opt/devkitpro/3dsvars.sh
            make PYTHON=python3 TEAVM_LOADER_DIR=/work/build/teavm-loader
            test -s build/min3dstry.3dsx
            ls -l build/min3dstry.3dsx
          '

      - name: Generate and build the ARM11 sector-slot probe
        run: |
          bash "$RUNNER_TEMP/Mindustry/gradlew" -p research/upstream-runtime \
            --no-daemon --console=plain \
            "-Dorg.gradle.jvmargs=-Xmx3g" \
            "-PupstreamCheckout=$RUNNER_TEMP/Mindustry" \
            "-PreferenceJar=$RUNNER_TEMP/server-release.jar" \
            "-ParcCheckout=$RUNNER_TEMP/Arc" \
            -Pprobe=campaign-sector generateC
          image=devkitpro/devkitarm@sha256:116afba8df8453961de2936ffab20dd441edf4d682856c1ec8b0e53d7ed0bbf5
          docker_numa_args=()
          if [ -n "${M3DS_DOCKER_CPUSET_CPUS:-}" ]; then
            docker_numa_args+=(--cpuset-cpus "$M3DS_DOCKER_CPUSET_CPUS")
          fi
          if [ -n "${M3DS_DOCKER_CPUSET_MEMS:-}" ]; then
            docker_numa_args+=(--cpuset-mems "$M3DS_DOCKER_CPUSET_MEMS")
          fi
          docker run --rm "${docker_numa_args[@]}" -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/work" -w /work "$image" bash -lc '
            source /opt/devkitpro/3dsvars.sh
            bash research/upstream-runtime/arm11/build.sh \
              research/upstream-runtime/build/generated/teavm/c \
              research/upstream-runtime/build/probe-3ds-campaign-sector'
          test -s research/upstream-runtime/build/probe-3ds-campaign-sector/upstream-probe.3dsx

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: upstream-arm11-campaign-sector
          path: |
            research/upstream-runtime/build/probe-3ds-campaign-sector/upstream-probe.3dsx
            research/upstream-runtime/build/probe-3ds-campaign-sector/upstream-probe.elf
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: upstream-arm11-world-roundtrip
          path: |
            research/upstream-runtime/build/probe-3ds-world-roundtrip/upstream-probe.3dsx
            research/upstream-runtime/build/probe-3ds-world-roundtrip/upstream-probe.elf
          if-no-files-found: error

  audio-inventory:
    name: Audio asset inventory
    needs: [changes]
    if: needs.changes.outputs.run_audio == 'true'
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.head.repo.fork)) && '["self-hosted", "linux", "x64", "min3dstry"]' || '"ubuntu-latest"') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/cache@v4
        if: runner.environment == 'github-hosted'
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-v1-${{ hashFiles('research/upstream-runtime/build.gradle', 'research/upstream-runtime/gradle/**') }}

      - name: Fetch pinned upstream asset tree, map, server JAR, and Arc
        run: bash .github/scripts/fetch_upstream_v160.sh --glacier --server-jar --arc

      - name: Run pinned audio inventory and runtime bindings baseline
        shell: bash
        run: |
          set -o pipefail
          java research/upstream-runtime/host/UpstreamAudioInventory.java \
            "$RUNNER_TEMP/Mindustry" | tee "$RUNNER_TEMP/audio.log"
          grep -F 'UPSTREAM_AUDIO kind=music files=16 bytes=28493699' "$RUNNER_TEMP/audio.log"
          grep -F 'UPSTREAM_AUDIO kind=sounds files=205 bytes=7093890' "$RUNNER_TEMP/audio.log"
          grep -F 'UPSTREAM_AUDIO total_files=221 total_bytes=35587589 manifest_sha256=f16c7f1c163d04b9843390146aafc2197cb6f6a3ad8db30e1872c7b1853be5fc' "$RUNNER_TEMP/audio.log"
          java -cp "$RUNNER_TEMP/server-release.jar" \
            research/upstream-runtime/host/UpstreamAudioBaseline.java \
            audio/upstream-audio-map.json \
            | tee "$RUNNER_TEMP/audio-baseline.log"
          grep -Fx 'UPSTREAM_AUDIO_REGISTRY sounds=205 musics=16 uiSounds=7 manifest_sha256=31b068d1493bf9f2ccf1c25d9646bba987bef82b3724317ee0eaf2ebf931790f' "$RUNNER_TEMP/audio-baseline.log"
          grep -Fx 'UPSTREAM_AUDIO_BINDINGS blocks=447 units=70 bullets=202 mapped=9 manifest_sha256=aff8c864f64176ae24daa083eb936c25ec6ddddf20871a5fd8fbf4ab8ce11cf4' "$RUNNER_TEMP/audio-baseline.log"
          grep -Fx 'UPSTREAM_AUDIO_POSITIONAL panNeg=-0.500 panPos=0.900 farCulled=true loopFadeIn=21 loopFadeOut=20' "$RUNNER_TEMP/audio-baseline.log"
          grep -Fx 'UPSTREAM_AUDIO_SIMULATION ticks=420 events=30 duoShots=19@tick49(pan=-0.145,vol=1.000) hail=4/4 unitExplode1=1@tick199(pan=0.120,vol=1.000) loops=conv:399,drill:420 clogGated=21' "$RUNNER_TEMP/audio-baseline.log"
          grep -Fx 'UPSTREAM_AUDIO_ORDER runs=2 ticks=420 events=30 trace_hash=0xd6a9ce67062c9b00' "$RUNNER_TEMP/audio-baseline.log"

      - name: Run audio-ticks JVM probe and generate TeaVM C
        shell: bash
        run: |
          set -o pipefail
          bash "$RUNNER_TEMP/Mindustry/gradlew" -p research/upstream-runtime \
            --no-daemon --console=plain \
            "-PupstreamCheckout=$RUNNER_TEMP/Mindustry" \
            "-PreferenceJar=$RUNNER_TEMP/server-release.jar" \
            "-ParcCheckout=$RUNNER_TEMP/Arc" \
            -Pprobe=audio-ticks \
            runProbeJvm "--args=$RUNNER_TEMP/glacier.msav" generateC | tee "$RUNNER_TEMP/audio-probe-jvm.log"
          grep -Fx 'UPSTREAM_WORLD_FINGERPRINT 2e7b9f883994de6c' "$RUNNER_TEMP/audio-probe-jvm.log"
          grep -Fx 'UPSTREAM_AUDIO_REGISTRY sounds=205 musics=16 duo=136 death=192 convLoop=63 drillLoop=67' "$RUNNER_TEMP/audio-probe-jvm.log"
          grep -Fx 'UPSTREAM_AUDIO_AMBIENT convTicks=399 drillTicks=420 loops=1,1 duoFirstPanMilli=-335 deathPanMilli=-520' "$RUNNER_TEMP/audio-probe-jvm.log"
          grep -Fx 'UPSTREAM_AUDIO_COMBAT shots=17 firstShot=49 deathTick=382 destroyed=382 ammo=23 events=20 trace=8dd46207043810fc' "$RUNNER_TEMP/audio-probe-jvm.log"

      - name: Verify generated audio-ticks TeaVM C at -O0 and -O2 against JVM trace
        shell: bash
        run: |
          set -o pipefail
          rm -rf "$RUNNER_TEMP/teavm-c-audio"
          cp -R research/upstream-runtime/build/generated/teavm/c "$RUNNER_TEMP/teavm-c-audio"
          python3 research/upstream-runtime/arm11/fix_reflection_lifetime.py "$RUNNER_TEMP/teavm-c-audio"
          python3 research/upstream-runtime/arm11/fix_gc_monitors.py "$RUNNER_TEMP/teavm-c-audio"
          cc -std=gnu11 -O0 -fwrapv -ffp-contract=off "$RUNNER_TEMP/teavm-c-audio/all.c" -lm -lpthread \
            -o "$RUNNER_TEMP/teavm-c-audio/probe_o0"
          cc -std=gnu11 -O2 -fwrapv -ffp-contract=off "$RUNNER_TEMP/teavm-c-audio/all.c" -lm -lpthread \
            -o "$RUNNER_TEMP/teavm-c-audio/probe_o2"
          "$RUNNER_TEMP/teavm-c-audio/probe_o0" "$RUNNER_TEMP/glacier.msav" | tee "$RUNNER_TEMP/audio-o0.log"
          "$RUNNER_TEMP/teavm-c-audio/probe_o2" "$RUNNER_TEMP/glacier.msav" | tee "$RUNNER_TEMP/audio-o2.log"
          for log in "$RUNNER_TEMP/audio-o0.log" "$RUNNER_TEMP/audio-o2.log"; do
            grep -Fx 'UPSTREAM_WORLD_FINGERPRINT 2e7b9f883994de6c' "$log"
            grep -Fx 'UPSTREAM_AUDIO_REGISTRY sounds=205 musics=16 duo=136 death=192 convLoop=63 drillLoop=67' "$log"
            grep -Fx 'UPSTREAM_AUDIO_AMBIENT convTicks=399 drillTicks=420 loops=1,1 duoFirstPanMilli=-335 deathPanMilli=-520' "$log"
            grep -Fx 'UPSTREAM_AUDIO_COMBAT shots=17 firstShot=49 deathTick=382 destroyed=382 ammo=23 events=20 trace=8dd46207043810fc' "$log"
          done

      - name: Build ARM11 audio-ticks probe with pinned devkitARM image
        run: |
          image=devkitpro/devkitarm@sha256:116afba8df8453961de2936ffab20dd441edf4d682856c1ec8b0e53d7ed0bbf5
          docker_numa_args=()
          if [ -n "${M3DS_DOCKER_CPUSET_CPUS:-}" ]; then
            docker_numa_args+=(--cpuset-cpus "$M3DS_DOCKER_CPUSET_CPUS")
          fi
          if [ -n "${M3DS_DOCKER_CPUSET_MEMS:-}" ]; then
            docker_numa_args+=(--cpuset-mems "$M3DS_DOCKER_CPUSET_MEMS")
          fi
          docker run --rm "${docker_numa_args[@]}" -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/work" -w /work "$image" bash -lc '
            source /opt/devkitpro/3dsvars.sh
            bash research/upstream-runtime/arm11/build.sh \
              research/upstream-runtime/build/generated/teavm/c \
              research/upstream-runtime/build/probe-3ds-audio'
          test -s research/upstream-runtime/build/probe-3ds-audio/upstream-probe.3dsx
          test -s research/upstream-runtime/build/probe-3ds-audio/upstream-probe.elf

