  singleplayer-baseline:
    name: Offline single-player Ground Zero baseline
    needs: [changes]
    if: needs.changes.outputs.run_singleplayer == 'true'
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.head.repo.fork)) && '["self-hosted", "linux", "x64", "min3dstry"]' || '"ubuntu-latest"') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/cache@v4
        if: runner.environment == 'github-hosted'
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-v1-${{ hashFiles('research/upstream-runtime/build.gradle', 'research/upstream-runtime/gradle/**') }}

      - name: Fetch pinned upstream source, server JAR, Arc, and Ground Zero
        run: |
          bash .github/scripts/fetch_upstream_v160.sh --mindustry --server-jar --arc
          git -C "$RUNNER_TEMP/Mindustry" show \
            HEAD:core/assets/maps/serpulo/groundZero.msav > "$RUNNER_TEMP/groundZero.msav"
          test -s "$RUNNER_TEMP/groundZero.msav"

      - name: Run singleplayer-sim JVM probe and generate TeaVM C
        shell: bash
        run: |
          set -o pipefail
          bash "$RUNNER_TEMP/Mindustry/gradlew" -p research/upstream-runtime \
            --no-daemon --console=plain \
            "-PupstreamCheckout=$RUNNER_TEMP/Mindustry" \
            "-PreferenceJar=$RUNNER_TEMP/server-release.jar" \
            "-ParcCheckout=$RUNNER_TEMP/Arc" \
            -Pprobe=singleplayer-sim \
            runProbeJvm "--args=$RUNNER_TEMP/groundZero.msav $RUNNER_TEMP/sp-jvm-save.msav" generateC \
            | tee "$RUNNER_TEMP/singleplayer-jvm.log"
          grep -F 'UPSTREAM_SP_LOADED source=map map=Ground_Zero size=256x256 wave=1 copper=0' "$RUNNER_TEMP/singleplayer-jvm.log"
          grep -F 'UPSTREAM_SP_SIM_PASS world=256x256 ' "$RUNNER_TEMP/singleplayer-jvm.log"

      - name: Verify generated singleplayer-sim TeaVM C at -O0 and -Os against JVM trace
        shell: bash
        run: |
          set -o pipefail
          rm -rf "$RUNNER_TEMP/teavm-c-singleplayer"
          cp -R research/upstream-runtime/build/generated/teavm/c "$RUNNER_TEMP/teavm-c-singleplayer"
          python3 - "$RUNNER_TEMP/teavm-c-singleplayer" <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "research/upstream-runtime/arm11")
          from fix_reflection_lifetime import fix_constructor_roots, fix_reflection_lifetime
          root = Path(sys.argv[1])
          fix_reflection_lifetime(root)
          fix_constructor_roots(root)
          PY
          cc -std=gnu11 -O0 -fwrapv -ffp-contract=off "$RUNNER_TEMP/teavm-c-singleplayer/all.c" -lm -lpthread \
            -o "$RUNNER_TEMP/teavm-c-singleplayer/probe_o0"
          cc -std=gnu11 -Os -fwrapv -ffp-contract=off "$RUNNER_TEMP/teavm-c-singleplayer/all.c" -lm -lpthread \
            -o "$RUNNER_TEMP/teavm-c-singleplayer/probe_os"
          expected=$(grep -F 'UPSTREAM_SP_SIM_PASS ' "$RUNNER_TEMP/singleplayer-jvm.log")
          test -n "$expected"
          "$RUNNER_TEMP/teavm-c-singleplayer/probe_o0" "$RUNNER_TEMP/groundZero.msav" "$RUNNER_TEMP/sp-c0-save.msav" \
            | tee "$RUNNER_TEMP/singleplayer-o0.log"
          "$RUNNER_TEMP/teavm-c-singleplayer/probe_os" "$RUNNER_TEMP/groundZero.msav" "$RUNNER_TEMP/sp-cs-save.msav" \
            | tee "$RUNNER_TEMP/singleplayer-os.log"
          grep -Fx "$expected" "$RUNNER_TEMP/singleplayer-o0.log"
          grep -Fx "$expected" "$RUNNER_TEMP/singleplayer-os.log"

      - name: Build ARM11 singleplayer-sim probe with pinned devkitARM image
        run: |
          image=devkitpro/devkitarm@sha256:116afba8df8453961de2936ffab20dd441edf4d682856c1ec8b0e53d7ed0bbf5
          docker_numa_args=()
          if [ -n "${M3DS_DOCKER_CPUSET_CPUS:-}" ]; then
            docker_numa_args+=(--cpuset-cpus "$M3DS_DOCKER_CPUSET_CPUS")
          fi
          if [ -n "${M3DS_DOCKER_CPUSET_MEMS:-}" ]; then
            docker_numa_args+=(--cpuset-mems "$M3DS_DOCKER_CPUSET_MEMS")
          fi
          docker run --rm "${docker_numa_args[@]}" -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/work" -w /work "$image" bash -lc '
            source /opt/devkitpro/3dsvars.sh
            bash research/upstream-runtime/arm11/build.sh \
              research/upstream-runtime/build/generated/teavm/c \
              research/upstream-runtime/build/probe-3ds-singleplayer'
          test -s research/upstream-runtime/build/probe-3ds-singleplayer/upstream-probe.3dsx
          test -s research/upstream-runtime/build/probe-3ds-singleplayer/upstream-probe.elf

      - name: Resume and save stock PC campaign slots on the JVM
        shell: bash
        run: |
          set -o pipefail
          check_dir=$(mktemp -d "$RUNNER_TEMP/campaign-resume.XXXXXX")
          fixtures="$check_dir/fixtures"
          python3 tools/campaign_resume_fixtures.py --server "$RUNNER_TEMP/server-release.jar" --output "$fixtures"
          mkdir -p "$fixtures/planets"
          git -C "$RUNNER_TEMP/Mindustry" show HEAD:core/assets/bundles/bundle.properties > "$fixtures/bundle.properties"
          git -C "$RUNNER_TEMP/Mindustry" show HEAD:core/assets/planets/serpulo.json > "$fixtures/planets/serpulo.json"
          bash "$RUNNER_TEMP/Mindustry/gradlew" -p research/upstream-runtime \
            --no-daemon --console=plain \
            "-PupstreamCheckout=$RUNNER_TEMP/Mindustry" \
            "-PreferenceJar=$RUNNER_TEMP/server-release.jar" \
            "-ParcCheckout=$RUNNER_TEMP/Arc" \
            -Pprobe=singleplayer runCampaignResumeJvm "--args=$fixtures $check_dir/save" \
            | tee "$RUNNER_TEMP/campaign-resume-jvm.log"
          grep -F 'UPSTREAM_CAMPAIGN_RESUME_REFERENCE slots=2 groundZero=170 frozenForest=64 backup=ok' \
            "$RUNNER_TEMP/campaign-resume-jvm.log"

      - name: Check unified multiplayer server address parsing on the JVM
        run: |
          bash "$RUNNER_TEMP/Mindustry/gradlew" -p research/upstream-runtime \
            --no-daemon --console=plain \
            "-PupstreamCheckout=$RUNNER_TEMP/Mindustry" \
            "-PreferenceJar=$RUNNER_TEMP/server-release.jar" \
            "-ParcCheckout=$RUNNER_TEMP/Arc" \
            -Pprobe=unified runServerAddressJvm
