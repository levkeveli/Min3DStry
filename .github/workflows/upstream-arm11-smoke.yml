  audio-conversion:
    name: Audio conversion
    needs: [changes]
    if: needs.changes.outputs.run_audio == 'true'
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.head.repo.fork)) && '["self-hosted", "linux", "x64", "min3dstry"]' || '"ubuntu-latest"') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Fetch pinned upstream asset tree
        run: bash .github/scripts/fetch_upstream_v160.sh --mindustry

      - name: Ensure ffmpeg is available
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Convert pinned upstream audio
        run: |
          test -f "$RUNNER_TEMP/Mindustry/core/assets/sounds/ui/waveSpawn.ogg"
          python3 tools/build_audio_assets.py \
            --upstream "$RUNNER_TEMP/Mindustry" \
            --map audio/upstream-audio-map.json \
            --triggers audio/upstream-audio-triggers.json \
            --out "$RUNNER_TEMP/audio" \
            --romfs-out "$RUNNER_TEMP/romfs-audio" | tee "$RUNNER_TEMP/audio-convert.log"
          grep -F 'AUDIO_ASSETS files=9' "$RUNNER_TEMP/audio-convert.log"
