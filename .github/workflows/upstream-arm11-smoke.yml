name: Live multiplayer world ARM11 build
on:
  push:
    branches: [test/3dsx-upstream-live-world]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        probe: [network-render]
        optimization: [2]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Generate C from pinned upstream source
        run: |
          set -o pipefail
          git clone --depth 1 --branch v160.8 --filter=blob:none --no-checkout https://github.com/Anuken/Mindustry.git "$RUNNER_TEMP/Mindustry"
          git -C "$RUNNER_TEMP/Mindustry" checkout HEAD -- gradlew gradle/wrapper
          git init "$RUNNER_TEMP/Arc"
          git -C "$RUNNER_TEMP/Arc" fetch --depth 1 https://github.com/Anuken/Arc.git 7445105cd2683daf5b9ac7033ebb07265d3e814d
          curl --fail --silent --show-error --location https://github.com/Anuken/Mindustry/releases/download/v160.8/server-release.jar -o "$RUNNER_TEMP/server-release.jar"
          curl --fail --silent --show-error --location https://github.com/Anuken/Mindustry/releases/download/v160.8/assets.jar -o "$RUNNER_TEMP/assets.jar"
          printf '%s  %s\n' 2728b63d309c27a405744c8b5440d90a65387a41e2c4339b630a239f79f6bd17 "$RUNNER_TEMP/assets.jar" | sha256sum --check
          unzip -p "$RUNNER_TEMP/assets.jar" assets/sprites/sprites.aatls > "$RUNNER_TEMP/sprites.aatls"
          bash "$RUNNER_TEMP/Mindustry/gradlew" -p research/upstream-runtime --no-daemon --console=plain "-PupstreamCheckout=$RUNNER_TEMP/Mindustry" "-PreferenceJar=$RUNNER_TEMP/server-release.jar" "-ParcCheckout=$RUNNER_TEMP/Arc" "-Pprobe=network-render" -Dorg.gradle.jvmargs=-Xmx3g generateC
      - name: Pack the original terrain atlas
        run: |
          cat > "$RUNNER_TEMP/run-tex3ds" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          exec docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:$PWD" -w "$PWD" \
            devkitpro/devkitarm@sha256:116afba8df8453961de2936ffab20dd441edf4d682856c1ec8b0e53d7ed0bbf5 \
            /opt/devkitpro/tools/bin/tex3ds "$@"
          EOF
          chmod +x "$RUNNER_TEMP/run-tex3ds"
          python3 research/upstream-runtime/arm11/prepare_terrain_assets.py \
            --assets "$RUNNER_TEMP/assets.jar" --server "$RUNNER_TEMP/server-release.jar" \
            --output-dir research/upstream-runtime/build/terrain-assets --tex3ds "$RUNNER_TEMP/run-tex3ds" --multiplayer
      - name: Compile with devkitARM and libctru
        run: |
          if [ "${{ matrix.optimization }}" = 0 ]; then
            sed -i 's/ -O2 / -O0 /' research/upstream-runtime/arm11/build.sh
          fi
          image=devkitpro/devkitarm@sha256:116afba8df8453961de2936ffab20dd441edf4d682856c1ec8b0e53d7ed0bbf5
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/work" -w /work "$image" bash -lc '
            source /opt/devkitpro/3dsvars.sh
            bash research/upstream-runtime/arm11/build.sh research/upstream-runtime/build/generated/teavm/c research/upstream-runtime/build/probe-3ds --network research/upstream-runtime/build/terrain-assets'
          test -s research/upstream-runtime/build/probe-3ds/upstream-probe.3dsx
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: upstream-arm11-${{ matrix.probe }}-o${{ matrix.optimization }}
          path: |
            research/upstream-runtime/build/probe-3ds/upstream-probe.3dsx
            research/upstream-runtime/build/probe-3ds/upstream-probe.elf
          if-no-files-found: error
