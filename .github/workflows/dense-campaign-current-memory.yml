name: Trace repeated dense campaign saves on New 3DS
on:
  push:
    branches: [test/dense-campaign-current-40m]
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/download-artifact@v4
        with:
          name: dense-campaign-unified-arm11
          path: build/unified-smoke
          github-token: ${{ github.token }}
          run-id: 45711354495
      - run: bash .github/scripts/setup_smoke_azahar.sh
      - name: Reload Serpulo 242 and verify both New 3DS saves
        run: |
          set -o pipefail
          server=build/unified-smoke/server-release.jar
          python3 tools/campaign_resume_fixtures.py --dense --server "$server" --output "$RUNNER_TEMP/dense-fixtures"
          printf '%s  %s\n' \
            afe8080ba81fc30cee43dcb1dc1ac318af81643c79a3d03a5188d4a0f3a2e55b build/unified-smoke/upstream-probe.3dsx \
            faeaf247a8b622de940181a96cb21cb20692d3c3da4e8ac3f79cb4af5059aa6c "$server" | sha256sum --check
          xvfb-run -a python3 tools/verify_upstream_campaign_resume.py --dense --dense-resave --model new3ds \
            --rom build/unified-smoke/upstream-probe.3dsx --server "$server" \
            --fixtures "$RUNNER_TEMP/dense-fixtures" --output-dir build/dense-campaign-replay
      - name: Resolve the managed allocation trace against this build
        if: always()
        run: |
          set -o pipefail
          log=build/dense-campaign-replay/new3ds-multiple.log
          [ -f "$log" ] || exit 0
          ids=$(sed -n 's/.*UPSTREAM_HEAP_CALLSITE depth=[0-9]* id=\([0-9]*\).*/\1/p' "$log" | sort -u | paste -sd '|')
          [ -n "$ids" ] || exit 0
          zgrep -E "[(]($ids)$" build/unified-smoke/heap-callsites.txt.gz |
            tee build/dense-campaign-replay/heap-allocation-callsites.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dense-campaign-azahar-evidence-new3ds
          path: |
            build/dense-campaign-replay/
            ${{ runner.temp }}/smoke-data/azahar-emu/log/
