name: Resume and save the dense 56 MiB diagnostic on New 3DS
on:
  push:
    branches: [test/dense-campaign-current-40m]
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/download-artifact@v4
        with:
          name: dense-campaign-unified-arm11
          path: build/unified-smoke
          github-token: ${{ github.token }}
          run-id: 45691243618
      - run: bash .github/scripts/setup_smoke_azahar.sh
      - name: Resume and reload Serpulo 242 on New 3DS
        run: |
          set -o pipefail
          server=build/unified-smoke/server-release.jar
          python3 tools/campaign_resume_fixtures.py --dense --server "$server" --output "$RUNNER_TEMP/dense-fixtures"
          printf '%s  %s\n' \
            5f047d641363b75ead94b5a8027fa8dbd6b4b3bf27b96764dc425dc5fdc6341e build/unified-smoke/upstream-probe.3dsx \
            faeaf247a8b622de940181a96cb21cb20692d3c3da4e8ac3f79cb4af5059aa6c "$server" | sha256sum --check
          xvfb-run -a python3 tools/verify_upstream_campaign_resume.py --dense --model new3ds \
            --rom build/unified-smoke/upstream-probe.3dsx --server "$server" \
            --fixtures "$RUNNER_TEMP/dense-fixtures" --output-dir build/dense-campaign-replay
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dense-campaign-azahar-evidence-new3ds
          path: |
            build/dense-campaign-replay/
            ${{ runner.temp }}/smoke-data/azahar-emu/log/
