name: Main verification alert

on:
  workflow_run:
    workflows: ["3DS full build", "Upstream ARM11 smoke"]
    types: [completed]
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  alert:
    name: Hold or release PRs on main verification result
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Block PRs on failure, release only when both heavy workflows are green
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            sha="${{ github.event.workflow_run.head_sha }}"
            name="${{ github.event.workflow_run.name }}"
            conclusion="${{ github.event.workflow_run.conclusion }}"
          else
            # Scheduled/dispatch run: release-check only.
            sha=$(gh api repos/"$GITHUB_REPOSITORY"/commits/main --jq '.sha')
            name="scheduled release check"
            conclusion="success"
          fi
          repo="$GITHUB_REPOSITORY"
          label="main-verify-blocked"

          # Ensure the automation label exists before using it.
          gh label list --repo "$repo" --json name --jq '.[].name' | grep -qx "$label" \
            || gh label create "$label" --repo "$repo" --color "d73a4a" \
                 --description "Automation hold: main post-merge verification is red" || true

          # Release when BOTH heavy workflows' latest runs on main are green
          # (a later fix commit may not retrigger a path-filtered workflow).
          both_green() {
            for wf in "3DS full build" "Upstream ARM11 smoke"; do
              c=$(gh run list --repo "$repo" --workflow "$wf" --branch main \
                  --limit 1 --json conclusion --jq '.[0].conclusion // "none"')
              [ "$c" = "success" ] || return 1
            done
            return 0
          }

          if [ "$conclusion" = "failure" ]; then
            title="Main verification failed @ $sha"
            existing=$(gh issue list --repo "$repo" --state open \
              --search "Main verification failed in:title" --json number --jq '.[0].number // empty')
            if [ -z "$existing" ]; then
              gh issue create --repo "$repo" --title "$title" \
                --label "$label" \
                --body "Post-merge verification failed on main @ \`$sha\` ($name). Open PRs get \`$label\`; the PR that fixes or reverts must remove its own label to merge. A merge onto red main will be reverted."
            fi
            blocked=0; failed=0
            for pr in $(gh pr list --repo "$repo" --state open --json number,labels --jq '.[] | select([.labels[].name] | any(. == "hold" or . == "needs-human" or . == "do-not-merge" or . == "status:blocked" or . == "tier:c" or . == "main-verify-blocked") | not) | .number'); do
              if gh pr edit "$pr" --repo "$repo" --add-label "$label"; then blocked=$((blocked+1)); else failed=$((failed+1)); fi
            done
            echo "Blocked $blocked PR(s), $failed failure(s)"
            [ "$failed" -eq 0 ]
          elif [ "$conclusion" = "success" ]; then
            if both_green; then
              issue=$(gh issue list --repo "$repo" --state open \
                --search "Main verification failed in:title" --json number --jq '.[0].number // empty')
              [ -z "$issue" ] || gh issue close "$issue" --repo "$repo" \
                --comment "Both heavy workflows green at \`$sha\`. Releasing \`$label\` holds."
              for pr in $(gh pr list --repo "$repo" --state open --json number,labels --jq '.[] | select([.labels[].name] | any(. == "main-verify-blocked")) | .number'); do
                gh pr edit "$pr" --repo "$repo" --remove-label "$label" || true
              done
            else
              echo "Not releasing: the other heavy workflow is not green at $sha"
            fi
          fi
