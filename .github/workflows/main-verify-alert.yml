name: Main verification alert

on:
  workflow_run:
    workflows: ["3DS full build", "Upstream ARM11 smoke"]
    types: [completed]
    branches: [main]

permissions:
  issues: write

jobs:
  alert:
    name: Alert on main verification failure
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Open blocking issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Main verification failed: ${{ github.event.workflow_run.name }} @ ${{ github.event.workflow_run.head_sha }}" \
            --body "Post-merge verification \`${{ github.event.workflow_run.name }}\` failed on main @ \`${{ github.event.workflow_run.head_sha }}\`.

Run: ${{ github.event.workflow_run.html_url }}

No new PRs should merge until this is fixed or reverted." \
            --label "status:blocked" || true
