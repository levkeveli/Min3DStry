name: Main verification alert

on:
  workflow_run:
    workflows: ["3DS full build", "Upstream ARM11 smoke"]
    types: [completed]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  alert:
    name: Hold or release PRs on main verification result
    if: github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Block PRs on failure, release them on success
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          sha="${{ github.event.workflow_run.head_sha }}"
          url="${{ github.event.workflow_run.html_url }}"
          name="${{ github.event.workflow_run.name }}"
          conclusion="${{ github.event.workflow_run.conclusion }}"
          if [ "$conclusion" = "failure" ]; then
            title="Main verification failed: $name @ $sha"
            existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
              --search "Main verification failed in:title" --json number --jq '.[0].number // empty')
            if [ -z "$existing" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
                --label "status:blocked" \
                --body "Post-merge verification \`$name\` failed on main @ \`$sha\`. Run: $url. Open PRs are labelled \`status:blocked\`; the PR that fixes or reverts this must remove its own label to merge."
            fi
            for pr in $(gh pr list --repo "$GITHUB_REPOSITORY" --state open --json number,labels --jq '.[] | select([.labels[].name] | any(. == "hold" or . == "needs-human" or . == "do-not-merge" or . == "status:blocked" or . == "tier:c") | not) | .number'); do
              gh pr edit "$pr" --repo "$GITHUB_REPOSITORY" --add-label "status:blocked" || true
            done
          elif [ "$conclusion" = "success" ]; then
            # Success path: close the blocking issue and release held PRs.
            issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
              --search "Main verification failed in:title" --json number --jq '.[0].number // empty')
            if [ -n "$issue" ]; then
              gh issue close "$issue" --repo "$GITHUB_REPOSITORY" \
                --comment "Main verification green again @ \`$sha\` ($name). Releasing \`status:blocked\` holds."
            fi
            for pr in $(gh pr list --repo "$GITHUB_REPOSITORY" --state open --json number,labels --jq '.[] | select([.labels[].name] | any(. == "status:blocked")) | .number'); do
              gh pr edit "$pr" --repo "$GITHUB_REPOSITORY" --remove-label "status:blocked" || true
            done
          fi
