name: Main verification alert

on:
  workflow_run:
    workflows: ["3DS full build", "Upstream ARM11 smoke"]
    types: [completed]
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write

jobs:
  alert:
    name: Hold or release PRs on main verification result
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Block PRs on red main, release when main is green
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          repo="$GITHUB_REPOSITORY"
          label="main-verify-blocked"
          main_sha=$(gh api repos/"$repo"/commits/main --jq '.sha')

          # Red predicate shared with the PR policy gate: a heavy workflow's
          # latest main run is failure-like AND belongs to main's current HEAD.
          main_red() {
            for wf in "3DS full build" "Upstream ARM11 smoke"; do
              read -r c sha_run < <(gh run list --repo "$repo" --workflow "$wf" --branch main \
                  --limit 1 --json conclusion,headSha --jq '.[0] | (.conclusion // "none") + " " + (.headSha // "")')
              case "$c" in failure|timed_out|startup_failure) ;; *) continue;; esac
              # Red if the failing run is on main's HEAD, or if main's HEAD
              # has no run for this workflow at all (fix merged without
              # retriggering the path-filtered workflow: unverified main).
              if [ "$sha_run" = "$main_sha" ]; then return 0; fi
              n=$(gh run list --repo "$repo" --workflow "$wf" --branch main \
                  --commit "$main_sha" --limit 1 --json id --jq '. | length')
              [ "$n" -eq 0 ] && return 0
            done
            return 1
          }

          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            sha="${{ github.event.workflow_run.head_sha }}"
            name="${{ github.event.workflow_run.name }}"
            conclusion="${{ github.event.workflow_run.conclusion }}"
          else
            # Scheduled/dispatch run: evaluate main and label or release.
            sha="$main_sha"
            name="scheduled check"
            if main_red; then conclusion="failure"; else conclusion="success"; fi
          fi

          # Ensure the automation labels exist before using them.
          for lbl in main-verify-blocked main-verify-fix; do
            gh label list --repo "$repo" --json name --jq '.[].name' | grep -qx "$lbl" \
              || gh label create "$lbl" --repo "$repo" --color "d73a4a" \
                   --description "Automation label: main post-merge verification hold" || true
          done

          case "$conclusion" in failure|timed_out|startup_failure) ;; *) conclusion="other";; esac
          if [ "$conclusion" != "other" ] && { [ "$sha" != "$main_sha" ] || ! main_red; }; then
            # Stale failure (run not on main's current HEAD): ignore.
            echo "Ignoring failure of $name @ $sha: not main's current HEAD ($main_sha)"
            exit 0
          fi

          if [ "$conclusion" != "other" ]; then
            title="Main verification failed @ $sha"
            existing=$(gh issue list --repo "$repo" --state open \
              --search "Main verification failed in:title" --json number --jq '.[0].number // empty')
            if [ -z "$existing" ]; then
              gh issue create --repo "$repo" --title "$title" \
                --label "$label" \
                --body "Post-merge verification failed on main @ \`$sha\` ($name). Open PRs get \`$label\`; the fixing/reverting PR must carry \`main-verify-fix\`. A merge onto red main will be reverted."
            fi
            blocked=0; failed=0
            for pr in $(gh pr list --repo "$repo" --state open --limit 100 --json number,labels --jq '.[] | select([.labels[].name] | any(. == "hold" or . == "needs-human" or . == "do-not-merge" or . == "status:blocked" or . == "tier:c" or . == "main-verify-blocked" or . == "main-verify-fix") | not) | .number'); do
              if gh pr edit "$pr" --repo "$repo" --add-label "$label"; then blocked=$((blocked+1)); else failed=$((failed+1)); fi
            done
            echo "Blocked $blocked PR(s), $failed failure(s)"
            [ "$failed" -eq 0 ]
          elif [ "$conclusion" = "success" ]; then
            if ! main_red; then
              issue=$(gh issue list --repo "$repo" --state open \
                --search "Main verification failed in:title" --json number --jq '.[0].number // empty')
              [ -z "$issue" ] || gh issue close "$issue" --repo "$repo" \
                --comment "Main verification green at \`$main_sha\`. Releasing \`$label\` holds."
              for pr in $(gh pr list --repo "$repo" --state open --limit 100 --json number,labels --jq '.[] | select([.labels[].name] | any(. == "main-verify-blocked" or . == "main-verify-fix")) | .number'); do
                gh pr edit "$pr" --repo "$repo" --remove-label "$label" || true
                gh pr edit "$pr" --repo "$repo" --remove-label "main-verify-fix" || true
              done
            else
              echo "Not releasing: main is still red at $main_sha"
            fi
          fi
