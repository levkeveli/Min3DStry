name: Recheck main New 3DS disconnect
on:
  push:
    branches: [codex/main-live-exit-repair]
permissions:
  contents: read
  actions: read
jobs:
  same-rom-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: unified-arm11-smoke
          path: build/unified-smoke
          github-token: ${{ github.token }}
          run-id: 45695100973
      - run: bash .github/scripts/setup_smoke_azahar.sh
      - name: Replay New 3DS movement, wave and START exit with the unchanged main ROM
        run: |
          sha256sum build/unified-smoke/upstream-probe.3dsx
          xvfb-run -a python3 tools/verify_upstream_live_net.py \
            --server build/unified-smoke/server-release.jar --rom build/unified-smoke/upstream-probe.3dsx \
            --azahar "$AZAHAR_BIN" --terrain-atlas build/unified-smoke/sprites.aatls \
            --unified-boot --controls --controls-replay --world-atlas --model new3ds
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: main-new3ds-disconnect-evidence
          path: |
            build/unified-smoke/upstream-live-net/
            ${{ runner.temp }}/smoke-data/azahar-emu/log/
