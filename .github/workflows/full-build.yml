name: 3DS full build

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "include/**"
      - "Makefile"
      - "tools/build_sprite_atlas.py"
      - "tests/assets/**"
      - "research/upstream-runtime/**"
      - "tools/build_teavm_loader.sh"
      - "tests/platform/embed_loader_smoke.c"
      - ".github/workflows/full-build.yml"
      - ".github/scripts/fetch_upstream_v160.sh"
      # The embedded save-rows loader compiles the shared world and content
      # sources. These standalone source sets never enter that target.
      - "!research/upstream-runtime/src/network-live/**"
      - "!research/upstream-runtime/src/network-render/**"
      - "!research/upstream-runtime/src/singleplayer/**"
      - "!research/upstream-runtime/src/singleplayer-campaign-host/**"
      - "!research/upstream-runtime/src/singleplayer-custom-host/**"
      - "!research/upstream-runtime/src/singleplayer-research-host/**"
      - "!research/upstream-runtime/src/terrain/**"
      - "!research/upstream-runtime/**/*.md"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "include/**"
      - "Makefile"
      - "tools/build_sprite_atlas.py"
      - "tests/assets/**"
      - "research/upstream-runtime/**"
      - "tools/build_teavm_loader.sh"
      - "tests/platform/embed_loader_smoke.c"
      - ".github/workflows/full-build.yml"
      - ".github/scripts/fetch_upstream_v160.sh"
      # The embedded save-rows loader compiles the shared world and content
      # sources. These standalone source sets never enter that target.
      - "!research/upstream-runtime/src/network-live/**"
      - "!research/upstream-runtime/src/network-render/**"
      - "!research/upstream-runtime/src/singleplayer/**"
      - "!research/upstream-runtime/src/singleplayer-campaign-host/**"
      - "!research/upstream-runtime/src/singleplayer-custom-host/**"
      - "!research/upstream-runtime/src/singleplayer-research-host/**"
      - "!research/upstream-runtime/src/terrain/**"
      - "!research/upstream-runtime/**/*.md"
  workflow_dispatch:

concurrency:
  group: full-build-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build default 3DS app
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.head.repo.fork)) && '["self-hosted", "linux", "x64", "min3dstry"]' || '"ubuntu-latest"') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Fetch pinned upstream source, server JAR and Arc
        run: bash .github/scripts/fetch_upstream_v160.sh --mindustry --server-jar --arc

      - name: Generate TeaVM loader C
        run: |
          bash "$RUNNER_TEMP/Mindustry/gradlew" -p research/upstream-runtime \
            --no-daemon --console=plain \
            "-Dorg.gradle.jvmargs=-Xmx3g" \
            "-PupstreamCheckout=$RUNNER_TEMP/Mindustry" \
            "-PreferenceJar=$RUNNER_TEMP/server-release.jar" \
            "-ParcCheckout=$RUNNER_TEMP/Arc" \
            -Pprobe=save-rows generateC

      - name: Build upstream audio RomFS
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          python3 tools/build_audio_assets.py \
            --upstream "$RUNNER_TEMP/Mindustry" \
            --map audio/upstream-audio-map.json \
            --triggers audio/upstream-audio-triggers.json \
            --out build/audio-romfs \
            --romfs-out build/romfs
          python3 tools/validate_audio_romfs.py build/romfs
          mkdir -p build/3ds
          cp build/romfs/audio-index.h build/3ds/audio-index.h

      - name: Build with embedded loader
        run: |
          image=devkitpro/devkitarm@sha256:116afba8df8453961de2936ffab20dd441edf4d682856c1ec8b0e53d7ed0bbf5
          docker_numa_args=()
          if [ -n "${M3DS_DOCKER_CPUSET_CPUS:-}" ]; then
            docker_numa_args+=(--cpuset-cpus "$M3DS_DOCKER_CPUSET_CPUS")
          fi
          if [ -n "${M3DS_DOCKER_CPUSET_MEMS:-}" ]; then
            docker_numa_args+=(--cpuset-mems "$M3DS_DOCKER_CPUSET_MEMS")
          fi
          docker run --rm "${docker_numa_args[@]}" -u "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD:/work" -v "$RUNNER_TEMP/Mindustry:/upstream/Mindustry:ro" \
            -w /work "$image" bash -lc '
            source /opt/devkitpro/3dsvars.sh
            python3 --version
            tex3ds --version
            bash tools/build_teavm_loader.sh \
              research/upstream-runtime/build/generated/teavm/c build/teavm-loader
            make PYTHON=python3 TEAVM_LOADER_DIR=/work/build/teavm-loader \
              UPSTREAM_MINDUSTRY=/upstream/Mindustry build/min3dstry.3dsx
            test -s build/min3dstry.3dsx
            test -s build/min3dstry.smdh
            python3 tools/validate_audio_romfs.py build/romfs
            artifact_bytes=$(stat -c %s build/min3dstry.3dsx)
            echo "artifact_bytes=${artifact_bytes}"
            # The audio-enabled full ROM is ~17 MiB locally; 24 MiB catches
            # runaway assets without rejecting the measured build.
            test "${artifact_bytes}" -lt 25165824
            # The strong embedded-loader symbol must win over the weak stub,
            # otherwise the app silently falls back to the native parser.
            arm-none-eabi-nm build/min3dstry.elf \
              | grep -q " T m3ds_teavm_world_load$"
            # Build (do not run) the loader smoke variants so the test file is
            # compiled by CI instead of only being referenced by a path filter.
            arm-none-eabi-gcc -std=gnu11 -g -Os -fwrapv -D__3DS__ \
              -mword-relocations -march=armv6k -mtune=mpcore -mfpu=vfp \
              -mfloat-abi=hard -mtp=soft \
              -Iinclude -I"$DEVKITPRO/libctru/include" \
              -L"$DEVKITPRO/libctru/lib" -Lbuild/teavm-loader -specs=3dsx.specs \
              tests/platform/embed_loader_smoke.c src/platform/world_rows.c \
              src/platform/msav_world.c -lm3dsloader -lctru -lm \
              -o build/embed-loader.elf
            arm-none-eabi-gcc -std=gnu11 -g -Os -fwrapv -D__3DS__ \
              -DM3DS_SMOKE_MISSING -mword-relocations -march=armv6k -mtune=mpcore \
              -mfpu=vfp -mfloat-abi=hard -mtp=soft \
              -Iinclude -I"$DEVKITPRO/libctru/include" \
              -L"$DEVKITPRO/libctru/lib" -Lbuild/teavm-loader -specs=3dsx.specs \
              tests/platform/embed_loader_smoke.c src/platform/world_rows.c \
              src/platform/msav_world.c -lm3dsloader -lctru -lm \
              -o build/embed-loader-missing.elf
            ls -l build/min3dstry.3dsx
          '

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: min3dstry-embedded-loader
          path: |
            build/min3dstry.3dsx
            build/min3dstry.smdh
